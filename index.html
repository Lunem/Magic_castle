      float y = fract(position.y - uTime * fall) * uH * 1.5 - uH * 0.05;
      vec3 p = vec3(position.x * uH * 2.0, y, position.z * uH * 2.0);   // a wide circle around the castle
      p.x += sin(uTime * (0.4 + seed) + seed * 40.0) * uH * 0.02;   // drifting
      p.z += cos(uTime * (0.3 + seed * 0.7) + seed * 17.0) * uH * 0.02;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vA = 0.55 + 0.45 * seed;
      gl_PointSize = clamp((1.6 + seed * 2.2) * uPR * uScale / -mv.z, 1.0, 7.0 * uPR);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    void main() {
      float a = smoothstep(0.5, 0.15, length(gl_PointCoord - 0.5));
      gl_FragColor = vec4(vec3(0.95, 0.96, 1.0), a * vA);
    }`,
});
const snowfall = new THREE.Points(snowGeo, snowMat);
snowfall.frustumCulled = false;
snowfall.visible = false;
scene.add(snowfall);

function updateXmas(t) {
  if (!snowfall.visible) return;
  if (snowMapDirty && !animating) renderSnowMap();
  xmasUniforms.uXmasTime.value = snowUniforms.uTime.value = t;
  snowUniforms.uH.value = castleHeight;
}

function subKey(path) { return path.split('/').slice(0, 2).join('/'); }

async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status + ' ' + url);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  const bar = document.querySelector('#bar i');
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) bar.style.width = Math.min(100, got / total * 100) + '%';
  }
  let blob = new Blob(chunks);
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {   // gzip magic: unpack in the browser
    blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
  }
  return blob.arrayBuffer();
}

// ---------- Explode animation ----------
let exploded = false, animT = 0, animating = false;
const maxOrder = Math.max(...Object.values(LAYERS).map(l => l.order));
const totalTime = EXPLODE_TIME + LAYER_DELAY * maxOrder;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const explodeBtn = document.getElementById('explode');
explodeBtn.addEventListener('click', () => {
  exploded = !exploded;
  animating = true;
  explodeBtn.textContent = exploded ? 'Assemble' : 'Explode';
});

function updateExplode(dt) {
  if (!animating) return;
  animT = THREE.MathUtils.clamp(animT + (exploded ? dt : -dt), 0, totalTime);
  for (const p of parts) {
    // Exploding: top layers leave first. Assembling: they return last.
    const delay = (maxOrder - p.order) * LAYER_DELAY;
    const k = ease(THREE.MathUtils.clamp((animT - delay) / EXPLODE_TIME, 0, 1));
    p.mesh.position.copy(p.offset).multiplyScalar(k);
  }
  if (animT === 0 || animT === totalTime) { animating = false; snowMapDirty = true; }   // parts moved: redo the snow cover
}

// ---------- Phone menu: the controls fold into a burger button ----------
const menuBtn = document.getElementById('menu');
function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
}
menuBtn.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
document.querySelector('.ui').addEventListener('click', e => { if (e.target.closest('button')) setMenu(false); });
renderer.domElement.addEventListener('pointerdown', () => setMenu(false));

// ---------- Spin toggle ----------
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('primary', controls.autoRotate);
});

// ---------- Height slider: slides the view down/up so the castle rises/sinks on screen ----------
const heightInput = document.getElementById('height');
let heightShift = 0;
function setHeight(v) {
  const next = -v / 100 * castleHeight * 0.6;   // raising the castle = moving the view down
  camera.position.y += next - heightShift;
  controls.target.y += next - heightShift;
  heightShift = next;
}
heightInput.addEventListener('input', () => setHeight(+heightInput.value));
heightInput.addEventListener('dblclick', () => { heightInput.value = 0; setHeight(0); });

// ---------- Enter: a travelling shot through the castle ----------
// The camera glides in from where it is, crosses the drawbridge, goes under the
// portcullis and through the vaulted passage, comes out on the back terrace, then
// rises and turns round to look up at the keep. Click Enter again, or drag, to stop.
// Points are in model coordinates (mm, z up; the front faces -x). The passage is
// clear at z -48: the portcullis and arches start higher, the back railing lower.
const TRAVEL_TIME = 16;   // seconds
const TRAVEL_CAMERA = [[-470, 0, -12], [-330, 0, -48], [-230, 0, -48], [-110, 0, -48],
  [30, 0, -48], [150, 0, -48], [250, 0, -42], [400, 25, 40], [560, 110, 230]];
const TRAVEL_LOOK = [[-210, 0, -44], [-100, 0, -48], [10, 0, -48], [120, 0, -48],
  [240, 0, -48], [340, 0, -44], [430, 20, -10], [120, 0, 260], [-40, -18, 390]];
const enterBtn = document.getElementById('enter');
let travel = null;

function startTravel() {
  // Put the castle back together and stop spinning first
  if (exploded || animating) {
    exploded = animating = false; animT = 0;
    for (const p of parts) p.mesh.position.set(0, 0, 0);
    explodeBtn.textContent = 'Explode';
  }
  controls.autoRotate = false;
  spinBtn.classList.remove('primary');
  heightInput.value = 0; heightShift = 0;
  const local = v => castle.worldToLocal(v.clone());
  const P = [local(camera.position), ...TRAVEL_CAMERA.map(p => new THREE.Vector3(...p))];
  const L = [local(controls.target), ...TRAVEL_LOOK.map(p => new THREE.Vector3(...p))];
  travel = { t: 0, cam: new THREE.CatmullRomCurve3(P, false, 'centripetal'), look: new THREE.CatmullRomCurve3(L, false, 'centripetal') };
  controls.enabled = false;
  camera.near = 1; camera.updateProjectionMatrix();   // the passage is narrow
  enterBtn.classList.add('primary');
  enterBtn.textContent = 'Stop';
  setHover(null);
}

function stopTravel() {
  if (!travel) return;
  // Hand the camera back to the orbit controls, looking where the shot was looking
  const look = castle.localToWorld(travel.look.getPoint(ease(Math.min(travel.t / TRAVEL_TIME, 1))));
  controls.target.copy(look);
  if (camera.position.distanceTo(look) < controls.minDistance)
    camera.position.copy(look).add(camera.position.clone().sub(look).setLength(controls.minDistance));
  travel = null;
  controls.enabled = true;
  camera.near = 5; camera.fov = 38; camera.updateProjectionMatrix();
  enterBtn.classList.remove('primary');
  enterBtn.textContent = 'Enter';
}

function updateTravel(dt) {
  travel.t += dt;
  const u = Math.min(travel.t / TRAVEL_TIME, 1), k = ease(u);
  // each stretch between two key points takes the same time, so the long approach is quick
  camera.position.copy(castle.localToWorld(travel.cam.getPoint(k)));
  camera.lookAt(castle.localToWorld(travel.look.getPoint(k)));
  // wider lens inside the castle
  const inside = THREE.MathUtils.smoothstep(k, 0.15, 0.3) * (1 - THREE.MathUtils.smoothstep(k, 0.62, 0.76));
  camera.fov = 38 + 22 * inside;
  camera.updateProjectionMatrix();
  if (u >= 1) stopTravel();
}

enterBtn.addEventListener('click', () => (travel ? stopTravel() : startTravel()));
renderer.domElement.addEventListener('pointerdown', () => stopTravel());
renderer.domElement.addEventListener('wheel', () => stopTravel(), { passive: true });

// ---------- Hover labels ----------
const label = document.getElementById('label');
const labelsBtn = document.getElementById('labels');
let labelsOn = localStorage.getItem('castle-labels') !== 'off';   // remembered between visits
labelsBtn.classList.toggle('primary', labelsOn);
labelsBtn.addEventListener('click', () => {
  labelsOn = !labelsOn;
  labelsBtn.classList.toggle('primary', labelsOn);
  localStorage.setItem('castle-labels', labelsOn ? 'on' : 'off');
  if (!labelsOn) setHover(null);
});
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let lastPick = 0, hovered = null, pointer = null;
const highlight = new THREE.Color(0x8f86ff);
renderer.domElement.addEventListener('pointermove', e => { pointer = e; });
renderer.domElement.addEventListener('pointerleave', () => { pointer = null; setHover(null); });

function pick(now) {
  if (!labelsOn || !pointer || now - lastPick < 90 || !parts.length) return;
  lastPick = now;
  mouse.set(pointer.clientX / innerWidth * 2 - 1, -pointer.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(castle, true)[0];
  setHover(hit ? hit.object : null);
  if (hovered) {
    label.style.left = pointer.clientX + 14 + 'px';
    label.style.top = pointer.clientY + 14 + 'px';
  }
}
function setHover(obj) {
  if (obj === hovered) return;
  if (hovered) {
    hovered.material.dispose();
    hovered.material = hovered.userData.baseMat;
    const pts = hovered.userData.starPoints;
    if (pts && pts.material !== castleStarMat) { pts.material.dispose(); pts.material = castleStarMat; }
  }
  hovered = obj;
  if (obj) {
    obj.userData.baseMat = obj.material;
    const m = obj.userData.baseMat.clone();
    m.onBeforeCompile = obj.userData.baseMat.onBeforeCompile;   // keep textured interiors
    m.customProgramCacheKey = obj.userData.baseMat.customProgramCacheKey;
    if (m.emissive) { m.emissive = highlight; m.emissiveIntensity = 0.35; }   // lit materials only
    if (m.uniforms?.uHi) m.uniforms.uHi.value = 1;                              // blueprint: blue pencil
    obj.material = m;
    const pts = obj.userData.starPoints;
    if (mode === 'stars' && pts) {
      // Star mode: light up this part's stars instead (shares time/size uniforms so it keeps twinkling)
      const sm = castleStarMat.clone();
      sm.uniforms = { ...castleStarUniforms, uBright: { value: castleStarUniforms.uBright.value * 2.2 } };
      pts.material = sm;
    }
    label.innerHTML = `${obj.userData.name}<small>${obj.userData.path.replaceAll('/', ' › ')}</small>`;
    label.style.opacity = 1;
  } else {
    label.style.opacity = 0;
  }
}

applyTheme(mode);   // after the hover code above is ready

// ---------- Loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  updateExplode(dt);
  pick(now);
  starUniforms.uTime.value = castleStarUniforms.uTime.value = waterUniforms.uWaterTime.value = now / 1000;
  updateFireworks(now / 1000);
  updateShine(now / 1000);
  updateTales(now / 1000, dt);
  updateXmas(now / 1000);
  if (THEMES[mode].floating) castle.position.y = castleBaseY + 40 + Math.sin(now / 2600) * 14;   // drifting in the void
  if (travel) updateTravel(dt); else controls.update();
  composer.render();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- Helpers ----------
function skyTexture(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d').createLinearGradient(0, 0, 0, 512);
  [0, 0.45, 0.75, 1].forEach((at, i) => g.addColorStop(at, stops[i]));
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

var starUniforms;
function makeStars(n, fullSphere = false) {
  const pos = new Float32Array(n * 3), size = new Float32Array(n), phase = new Float32Array(n), col = new Float32Array(n * 3);
  const tint = [new THREE.Color(0xffffff), new THREE.Color(0xbfd0ff), new THREE.Color(0xd6c4ff), new THREE.Color(0xa9e4ff)];
  for (let i = 0; i < n; i++) {
    const u = Math.random(), v = fullSphere ? Math.random() * 2 : Math.random() * 0.92 + 0.08;   // full sphere, or above the horizon only
    const th = u * Math.PI * 2, ph = Math.acos(1 - v);
    const r = 6000 + Math.random() * 2000;
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
    size[i] = Math.pow(Math.random(), 6) * 7 + 1.2;
    phase[i] = Math.random() * 100;
    tint[i % 4].toArray(col, i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  starUniforms ??= { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uDim: { value: 1 }, uSize: { value: 1 } };   // shared by every starfield
  const mat = new THREE.ShaderMaterial({
    uniforms: starUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float size; attribute float phase; attribute vec3 color;
      uniform float uTime; uniform float uPR; uniform float uDim; uniform float uSize; varying float vA; varying vec3 vC;
      void main() {
        vA = (0.55 + 0.45 * sin(uTime * (0.6 + fract(phase) * 2.0) + phase)) * uDim;
        vC = color;
        gl_PointSize = max(1.0, size * uSize * uPR);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying float vA; varying vec3 vC;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vC, a * a * vA);
      }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  return pts;
}
