<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle by Night</title>
<style>
  :root { --ink: #dfe3ff; --dim: #8f93c4; --glass: rgba(14, 14, 38, 0.55); --edge: rgba(170, 160, 255, 0.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05050f; color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .ui { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(10px); }
  button { appearance: none; border: 1px solid var(--edge); background: rgba(120, 110, 255, 0.12);
    color: var(--ink); font: inherit; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  button:hover { background: rgba(150, 140, 255, 0.25); box-shadow: 0 0 18px rgba(140, 130, 255, 0.35); }
  button.primary { background: rgba(150, 140, 255, 0.28); }
  button:disabled { opacity: .4; cursor: default; }
  h1 { position: fixed; top: 22px; left: 28px; margin: 0; font-weight: 300; font-size: 15px;
    letter-spacing: .35em; text-transform: uppercase; color: var(--dim); }
  #label { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 8px;
    background: var(--glass); border: 1px solid var(--edge); font-size: 12px; white-space: nowrap;
    opacity: 0; transition: opacity .15s; }
  #label small { display: block; color: var(--dim); }
  #loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
    color: var(--dim); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; transition: opacity .8s; }
  #bar { width: 220px; height: 2px; background: rgba(255,255,255,.08); overflow: hidden; border-radius: 2px; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7b6cff, #b9e2ff);
    box-shadow: 0 0 12px #9b8cff; transition: width .2s; }
  .hint { position: fixed; top: 22px; right: 28px; color: var(--dim); font-size: 12px; text-align: right; }
  .seg { display: flex; gap: 4px; padding-left: 10px; border-left: 1px solid var(--edge); }
  .seg button { padding: 10px 16px; }
  .seg button.active { background: rgba(170, 160, 255, 0.4); box-shadow: inset 0 0 0 1px rgba(200, 190, 255, 0.5); }
  body.day .seg button.active { background: #fff; }
  #err { display: none; position: fixed; top: 60px; left: 28px; right: 28px; max-height: 40vh; overflow: auto; margin: 0;
    padding: 12px; border-radius: 8px; background: rgba(60, 0, 20, 0.85); color: #ffd6de; font: 12px/1.4 ui-monospace, monospace;
    white-space: pre-wrap; user-select: text; z-index: 10; }
  .actions { display: flex; gap: 10px; }
  .hint .touch { display: none; }
  @media (pointer: coarse) { .hint .mouse { display: none; } .hint .touch { display: inline; } }
  /* Phones and narrow windows: hint under the title, menu on two rows */
  @media (max-width: 720px) {
    h1 { top: 16px; left: 16px; font-size: 13px; letter-spacing: .28em; }
    .hint { top: 40px; left: 16px; right: 16px; text-align: left; font-size: 11px; }
    .ui { flex-direction: column; gap: 6px; padding: 6px; border-radius: 24px;
      bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 16px); }
    .actions, .seg { gap: 6px; justify-content: center; }
    .actions { flex-wrap: wrap; }
    .seg { padding-left: 0; border-left: 0; flex-wrap: wrap; }
    button, .seg button { padding: 9px 16px; font-size: 12px; letter-spacing: .06em; }
    #err { top: 70px; left: 12px; right: 12px; }
  }
  .height { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
    align-items: center; gap: 8px; padding: 12px 8px; border-radius: 999px; background: var(--glass);
    border: 1px solid var(--edge); backdrop-filter: blur(10px); color: var(--dim); font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; }
  .height input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 180px; margin: 0;
    accent-color: #9b8cff; cursor: ns-resize; }
  @media (max-width: 720px) { .height { right: 8px; padding: 10px 4px; } .height input { height: 130px; } }
  /* Blueprint: drawing-sheet frame with grid references */
  #sheet { display: none; position: fixed; inset: 10px; pointer-events: none; border: 1px solid rgba(52, 51, 61, .5);
    font: 11px/1 Georgia, "Times New Roman", serif; color: rgba(52, 51, 61, .75); }
  body.paper #sheet { display: block; }
  #sheet::after { content: ''; position: absolute; inset: 16px; border: 1.5px solid rgba(52, 51, 61, .7); }
  #sheet .ref { position: absolute; transform: translate(-50%, -50%); }
  #sheet .ref.top { top: 8px; } #sheet .ref.bottom { top: calc(100% - 8px); }
  #sheet .ref.left { left: 8px; } #sheet .ref.right { left: calc(100% - 8px); }
  #sheet .tick { position: absolute; background: rgba(52, 51, 61, .55); }
  #sheet .tick.top, #sheet .tick.bottom { width: 1px; height: 16px; } #sheet .tick.top { top: 0; } #sheet .tick.bottom { bottom: 0; }
  #sheet .tick.left, #sheet .tick.right { height: 1px; width: 16px; } #sheet .tick.left { left: 0; } #sheet .tick.right { right: 0; }
  body.paper h1 { font-family: Georgia, "Times New Roman", serif; top: 38px; left: 44px; }
  body.paper .hint { top: 38px; right: 44px; }
  #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  body.day { --ink: #1f2547; --dim: #4b557e; --glass: rgba(255, 255, 255, 0.55); --edge: rgba(40, 60, 130, 0.22); }
  body.day button { background: rgba(255, 255, 255, 0.35); }
  body.day button:hover { background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 18px rgba(255, 255, 255, 0.6); }
  body.day button.primary { background: rgba(255, 255, 255, 0.75); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }
</script>
</head>
<body>
<h1>Castle by Night</h1>
<div class="hint"><span class="mouse">Drag to orbit · Scroll to zoom · Right-drag to pan</span><span class="touch">Drag to orbit · Pinch to zoom · Two-finger drag to pan</span></div>
<div id="loader"><span id="loadText">Summoning the castle</span><div id="bar"><i></i></div></div>
<div id="label"></div>
<div id="fade"></div>
<pre id="err"></pre>
<div id="sheet"></div>
<label class="height" title="Raise or lower the castle (double-click to reset)">
  <span>Height</span>
  <input id="height" type="range" min="-100" max="100" value="0" step="1">
</label>
<div class="ui">
  <span class="actions">
    <button id="explode" class="primary" disabled>Explode</button>
    <button id="spin">Spin</button>
    <button id="enter" disabled title="Travel through the castle">Enter</button>
    <button id="labels" class="primary" title="Highlight parts and show their names on hover">Labels</button>
  </span>
  <span class="seg">
    <button data-mode="night">Night</button>
    <button data-mode="day">Day</button>
    <button data-mode="stars">Stars</button>
    <button data-mode="magic">Magic</button>
    <button data-mode="blueprint">Blueprint</button>
    <button data-mode="shine">Shine</button>
    <button data-mode="tales">Tales</button>
  </span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const MODEL_URL = 'models/castle.bin.gz';

// ---------- Explode settings (units: mm, model is Z-up) ----------
// Each top-level folder is a layer. Layers lift apart vertically; within a
// layer, each sub-assembly (second-level folder) slides outward from the center.
const LAYERS = {
  ROCHERS:   { lift: -160, spread: 140, order: 0 },
  BASE:      { lift:    0, spread: 190, order: 1 },
  BATIMENTS: { lift:  260, spread: 170, order: 2 },
  DONJON:    { lift:  560, spread:  60, order: 3 },
};
const EXPLODE_TIME = 1.6;   // seconds per layer
const LAYER_DELAY  = 0.35;  // stagger between layers

// ---------- Errors are shown on screen (easier to report than the console) ----------
function showError(e) {
  console.error(e);
  const box = document.getElementById('err');
  box.textContent += (e && (e.stack || e.message) || String(e)) + '\n';
  box.style.display = 'block';
}
addEventListener('error', ev => showError(ev.error || ev.message));
addEventListener('unhandledrejection', ev => showError(ev.reason));

// ---------- Renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', () => showError('WebGL context lost: the graphics card stopped rendering this page.'));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0a22, 0.00045);
const SKY_NIGHT = skyTexture(['#02020a', '#0a0a26', '#1b1446', '#2a1d55']);
const SKY_DAY = skyTexture(['#3f74c4', '#6f9fdd', '#a9c9ee', '#e4edf6']);
scene.background = SKY_NIGHT;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 5, 20000);
camera.position.set(900, 700, 1300);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.92;   // below the ground too, for low-angle views
controls.minDistance = 200;
controls.maxDistance = 4000;
controls.autoRotateSpeed = 0.5;

// ---------- Lights: cold moonlight + violet ambience ----------
const hemi = new THREE.HemisphereLight(0x7d86ff, 0x1a0f2e, 0.9);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xc6d4ff, 2.4);
moon.position.set(-700, 1100, 500);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -700, right: 700, top: 1400, bottom: -500, near: 100, far: 3500 });
moon.shadow.bias = -0.0004;
moon.shadow.normalBias = 1.2;
scene.add(moon, moon.target);
const rim = new THREE.DirectionalLight(0x9a6bff, 1.1);
rim.position.set(800, 300, -900);
scene.add(rim);

// ---------- Moon disc ----------
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(120, 64),
  new THREE.MeshBasicMaterial({ color: 0xe8ecff, fog: false }));
moonDisc.position.set(-3500, 2600, -5200);
moonDisc.lookAt(0, 0, 0);
scene.add(moonDisc);

// ---------- Starfield with twinkle ----------
const stars = makeStars(7000);
scene.add(stars);
const voidStars = makeStars(20000, true);   // all around, including below: star mode only
voidStars.visible = false;
scene.add(voidStars);

// ---------- Materials (night) ----------
const MATS = {
  stone:   new THREE.MeshStandardMaterial({ color: 0xb8b6d2, roughness: 0.85, flatShading: true }),
  roof:    new THREE.MeshStandardMaterial({ color: 0x334a86, roughness: 0.5, metalness: 0.25, flatShading: true }),
  timber:  new THREE.MeshStandardMaterial({ color: 0x5b4a5e, roughness: 0.9, flatShading: true }),
  iron:    new THREE.MeshStandardMaterial({ color: 0x2b2a3a, roughness: 0.4, metalness: 0.8, flatShading: true }),
  grass:   new THREE.MeshStandardMaterial({ color: 0x2f4a52, roughness: 1, flatShading: true }),
  rock:    new THREE.MeshStandardMaterial({ color: 0x67657e, roughness: 1, flatShading: true }),
  flag:    new THREE.MeshStandardMaterial({ color: 0xcfc8ff, emissive: 0x6a5cff, emissiveIntensity: 0.6, flatShading: true, side: THREE.DoubleSide }),
  lantern: new THREE.MeshStandardMaterial({ color: 0xbfe8ff, emissive: 0x9fdcff, emissiveIntensity: 2.2, flatShading: true }),
  water:   waterMat(0x24405e, 0.08, 0.45),
};

// ---------- Water: smooth, with small moving ripples (bent normals, no extra geometry) ----------
const waterUniforms = { uWaterTime: { value: 0 } };
function waterMat(color, roughness, metalness, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, waterUniforms);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWater, vWN, vWX, vWY;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vWater = position;
        vWN = normalize(normalMatrix * vec3(0.0, 0.0, 1.0));   // model z is up
        vWX = normalize(normalMatrix * vec3(1.0, 0.0, 0.0));
        vWY = normalize(normalMatrix * vec3(0.0, 1.0, 0.0));`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWater, vWN, vWX, vWY;\nuniform float uWaterTime;')
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      {
        float t = uWaterTime; vec2 p = vWater.xy;
        vec2 g = vec2(0.8, 0.3) * cos(dot(p, vec2(0.8, 0.3)) * 0.35 + t * 1.3)
               + vec2(-0.4, 0.9) * cos(dot(p, vec2(-0.4, 0.9)) * 0.5 + t * 1.7) * 0.7
               + vec2(0.6, -0.7) * cos(dot(p, vec2(0.6, -0.7)) * 0.9 - t * 2.1) * 0.4;
        normal = normalize(vWN - 0.12 * (g.x * vWX + g.y * vWY));
      }`);
  };
  m.customProgramCacheKey = () => 'water';
  return m;
}

// ---------- Materials (day): palette taken from the kit's colour renders ----------
const std = (color, roughness, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, flatShading: true, ...extra });
const DAY_MATS = {
  wall:    std(0xe4a79c, 0.75),          // powder pink walls (buildings, keep)
  base:    std(0xa4b5d9, 0.8),           // pale lavender-blue base walls
  trim:    std(0xf2ece1, 0.6),           // cream crenellations, cornices, columns
  roof:    std(0x2f6798, 0.45, 0.15),    // slate blue roofs
  gold:    std(0xd8b04a, 0.3, 0.85),     // finials, spires, flags
  timber:  std(0x6f4430, 0.85),
  tree:    std(0x4a2e22, 0.9),
  glass:   std(0x2c4e88, 0.15, 0.3),     // stained glass
  brick:   std(0xc4867b, 0.85),
  iron:    std(0x2c2c33, 0.4, 0.8),
  grass:   std(0x5f8b45, 1),
  hedge:   std(0x3b6a32, 0.95),          // topiary trees: dark clipped foliage
  rock:    std(0xcac7c2, 0.95),
  lantern: std(0xf4e6b8, 0.3, 0.2, { emissive: 0xffd98a, emissiveIntensity: 0.25 }),
  water:   waterMat(0x5fa595, 0.1, 0.15),    // green-turquoise, like the basin on the photos
};

// Magic: day colours under coloured floodlights, dark roofs for the LEDs, warm windows
const MAGIC_MATS = { ...DAY_MATS,
  roof:    std(0x18204f, 0.35, 0.45),
  lantern: std(0xffe2a0, 0.3, 0, { emissive: 0xffbf5a, emissiveIntensity: 2.6 }),
  glass:   std(0x2c4e88, 0.15, 0.3, { emissive: 0xffb860, emissiveIntensity: 0.9 }),
  water:   waterMat(0x102838, 0.06, 0.55),   // dark, catching the coloured lights
};

// Bronze / copper brown parts: the rotonde roof (not slate blue; the LEDs still light it in Magic)
// and the entrance sign by the grotto
const BRONZE = {
  night: new THREE.MeshStandardMaterial({ color: 0x6a4a52, roughness: 0.45, metalness: 0.5, flatShading: true }),
  day:   std(0x7b4a30, 0.4, 0.65),
  magic: std(0x4a2b22, 0.35, 0.6),
};
const isBronze = p => (p.path === 'BATIMENTS/Rotonde/Batiment/Toiture' && p.name === 'Toit')
  || (p.path === 'ROCHERS/Rochers/Entree bas' && p.name === 'Panneau entree');

function dayKey(p) {
  const n = p.name.toLowerCase(), layer = p.path.split('/')[0];
  if (/^feuillage/.test(n)) return 'hedge';
  if (p.mat === 'iron' || p.mat === 'lantern' || p.mat === 'grass' || p.mat === 'water') return p.mat;
  if (p.mat === 'rock' || /^rocher/.test(n)) return 'rock';
  if (/faitage|drapeau|chouette|sphere|cloche|^pointe|jonction pointe|^ornement/.test(n)) return 'gold';
  if (/arbre|branche|^tronc/.test(n)) return 'tree';
  if (/^muraille/.test(n)) return layer === 'BASE' ? 'base' : 'wall';
  if (/colombage|porte|pont levis|charpente|escalier bois|medaillon/.test(n)) return 'timber';
  if (/encadrement|garde corps/.test(n)) return 'trim';
  if (/vitra|vitres/.test(n)) return 'glass';
  if (/chemin|brique/.test(n)) return 'brick';
  if (/sous toit|arcades sous|arceaux|encadrements piliers|interieur sous|jonction etage et toit/.test(n)) return 'trim';
  if (p.mat === 'roof' || /^toit/.test(n)) return 'roof';
  if (/corps|^mur/.test(n)) return layer === 'BASE' ? 'base' : 'wall';
  if (/creneau|corniche|corbeau|colonne|^col\.|pilier|pilastre|balcon|arche|arcade|rambarde|main courante|encadrement|appui|linteau|meneau|moulure|culot|anneau|jonction|dessus|fenetre|fenestrou|garde corps|marches|escalier|support|voute|bordure|barreau/.test(n)) return 'trim';
  return layer === 'BASE' ? 'base' : 'wall';
}

// ---------- Ambiences: night, day, and a castle made of stars ----------
const SKY_VOID = skyTexture(['#000003', '#02020a', '#050414', '#08061a']);
const SKY_MAGIC = skyTexture(['#000002', '#02020e', '#070520', '#120c3a']);
const THEMES = {
  night: { sky: SKY_NIGHT, fog: 0x0b0a22, fogDensity: 0.00045, exposure: 1.05,
    hemi: [0x7d86ff, 0x1a0f2e, 0.9], key: [0xc6d4ff, 2.4, -700, 1100, 500], rim: [0x9a6bff, 1.1],
    ground: 0x0d0c22, bloom: [0.55, 0.82], stars: true, moon: true, title: 'Castle by Night', fade: '#05050f' },
  day:   { sky: SKY_DAY, fog: 0xd6e3f2, fogDensity: 0.00018, exposure: 1.0,
    hemi: [0xd8e8ff, 0x6d7b58, 1.4], key: [0xfff0d8, 3.2, 900, 1500, 700], rim: [0xbcd4ff, 0.5],
    ground: 0x83946f, bloom: [0.12, 0.95], stars: false, title: 'Castle by Day', fade: '#eef3fb' },
  stars: { sky: SKY_VOID, fog: 0x000000, fogDensity: 0, exposure: 1.0,
    hemi: [0x7d86ff, 0x1a0f2e, 0.9], key: [0xc6d4ff, 2.4, -700, 1100, 500], rim: [0x9a6bff, 1.1],
    ground: null, bloom: [0.85, 0.1], stars: false, voidStars: true, skyDim: 0.5, skySize: 0.65, floating: true,
    title: 'Castle of Stars', fade: '#000003' },
  magic: { sky: SKY_MAGIC, fog: 0x07051c, fogDensity: 0.00025, exposure: 1.0,
    hemi: [0x5a48d0, 0x120826, 0.5], key: [0x8f9cff, 0.4, -700, 1100, 500], rim: [0xc070ff, 0.6],
    ground: 0x0a0820, bloom: [0.8, 0.55], stars: false, uplights: true, leds: true, fireworks: true,
    title: 'Magic Castle', fade: '#000005' },
};
THEMES.blueprint = { sky: paperTexture(), fog: 0xece5d1, fogDensity: 0, exposure: 1.0,
  hemi: [0xffffff, 0xffffff, 1], key: [0xffffff, 1, 900, 1500, 700], rim: [0xffffff, 0],
  ground: null, bloom: [0, 1], stars: false, paper: true, title: 'Castle Blueprint', fade: '#ece5d1' };
THEMES.shine = { sky: SKY_MAGIC, fog: 0x07051c, fogDensity: 0.00022, exposure: 1.0,
  hemi: [0x6a58e0, 0x140a30, 0.55], key: [0x9fa8ff, 0.3, -700, 1100, 500], rim: [0xd070ff, 0.8],
  ground: 0x0a0820, bloom: [0.5, 0.62], stars: true, uplights: true, uplightScale: 0.45, shine: true,
  title: 'Shining Castle', fade: '#04031a' };
THEMES.tales = { sky: SKY_MAGIC, fog: 0x07051c, fogDensity: 0.00022, exposure: 1.0,
  hemi: [0x3a2c90, 0x0a0618, 0.35], key: [0x8f9cff, 0.2, -700, 1100, 500], rim: [0xc070ff, 0.5],
  ground: 0x0a0820, bloom: [0.6, 0.5], stars: true, uplights: true, uplightScale: 0.35, fireworks: true, tales: true,
  title: 'Castle Tales', fade: '#04031a' };
let mode = 'day';   // the page always opens in daylight

// ---------- Ground ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(4000, 96),
  new THREE.MeshStandardMaterial({ color: 0x0d0c22, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Post-processing: soft glow ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Mode switch ----------
function applyTheme(m) {
  const T = THEMES[m];
  mode = m;
  scene.background = T.sky;
  scene.fog.color.setHex(T.fog);
  scene.fog.density = T.fogDensity;
  renderer.toneMappingExposure = T.exposure;
  renderer.toneMapping = T.paper ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;   // keep the paper's true colours
  hemi.color.setHex(T.hemi[0]); hemi.groundColor.setHex(T.hemi[1]); hemi.intensity = T.hemi[2];
  moon.color.setHex(T.key[0]); moon.intensity = T.key[1]; moon.position.set(T.key[2], T.key[3], T.key[4]);
  rim.color.setHex(T.rim[0]); rim.intensity = T.rim[1];

// ---------- Castle made of stars ----------
// Points are scattered evenly over every part's surface (area-weighted) and added

const DEPTH_ONLY = new THREE.MeshBasicMaterial({ colorWrite: false });

  { match: p => p.path === 'BASE/Bassin', count: 0.5, glow: 0.7 },       // the water: a faint shimmer
  { match: p => p.name.startsWith('Ornement'), count: 10, glow: 1.2 },   // gilded fleur-de-lys over the oval windows: tiny, needs more stars

// Even (area-weighted) random points over a part's surface, lifted slightly off it.
function surfaceSampler(geo) {
  const P = geo.attributes.position.array, I = geo.index.array;
  const cum = new Float32Array(I.length / 3);
  let area = 0;
  for (let t = 0; t < cum.length; t++) {
    const i0 = I[t * 3] * 3, i1 = I[t * 3 + 1] * 3, i2 = I[t * 3 + 2] * 3;
    const ux = P[i1] - P[i0], uy = P[i1 + 1] - P[i0 + 1], uz = P[i1 + 2] - P[i0 + 2];
    const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;

  return {
    area,
    sample(out, j, lift = SURFACE_LIFT, nOut) {    // writes one point at out[j*3..j*3+2] (and its normal in nOut)
      const r = Math.random() * area;
      let lo = 0, hi = cum.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
      const i0 = I[lo * 3] * 3, i1 = I[lo * 3 + 1] * 3, i2 = I[lo * 3 + 2] * 3;

      const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];

      const len = Math.hypot(nx, ny, nz) || 1, k = lift / len;
      if (nOut) { nOut[j * 3] = nx / len; nOut[j * 3 + 1] = ny / len; nOut[j * 3 + 2] = nz / len; }

      out[j * 3 + 1] = P[i0 + 1] + u * uy + v * vy + ny * k;
      out[j * 3 + 2] = P[i0 + 2] + u * uz + v * vz + nz * k;
    },
  };
}

// Random points along a part's sharp edges: folds between two faces sharper than
// EDGE_ANGLE, and open borders. Each point is pushed off the surface along the
// average of the two face normals, so it sits on the outside of the edge.
function edgeSampler(geo) {
  const P = geo.attributes.position.array, I = geo.index.array, nt = I.length / 3;
  const fn = new Float32Array(nt * 3);
  for (let t = 0; t < nt; t++) {
    const i0 = I[t * 3] * 3, i1 = I[t * 3 + 1] * 3, i2 = I[t * 3 + 2] * 3;
    const ux = P[i1] - P[i0], uy = P[i1 + 1] - P[i0 + 1], uz = P[i1 + 2] - P[i0 + 2];
    const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx, l = Math.hypot(cx, cy, cz) || 1;
    fn[t * 3] = cx / l; fn[t * 3 + 1] = cy / l; fn[t * 3 + 2] = cz / l;

  const first = new Map(), cos = Math.cos(EDGE_ANGLE * Math.PI / 180), segs = [];

    if (t2 >= 0) { nx += fn[t2 * 3]; ny += fn[t2 * 3 + 1]; nz += fn[t2 * 3 + 2]; }
    const l = Math.hypot(nx, ny, nz) || 1;
    segs.push(a, b, nx / l, ny / l, nz / l);

  for (let t = 0; t < nt; t++) for (let e = 0; e < 3; e++) {
    const a = I[t * 3 + e], b = I[t * 3 + (e + 1) % 3], key = a < b ? a * 65536 + b : b * 65536 + a;
    const o = first.get(key);
    if (o === undefined) { first.set(key, t); continue; }
    first.set(key, -1);   // seen twice: done
    if (o >= 0 && fn[o * 3] * fn[t * 3] + fn[o * 3 + 1] * fn[t * 3 + 1] + fn[o * 3 + 2] * fn[t * 3 + 2] < cos) add(a, b, o, t);

  for (const [key, t] of first) if (t >= 0) add(Math.floor(key / 65536), key % 65536, t, -1);   // open borders

    length, segs, P,
    sample(out, j, nOut, lift = SURFACE_LIFT * 1.5) {
      const r = Math.random() * length;

      while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
      const a = segs[lo * 5] * 3, b = segs[lo * 5 + 1] * 3, f = Math.random();

        nOut[j * 3 + c] = n;
      }
    },
  };
}

function buildCastleStars() {
  castleStarsBuilt = true;
  const samplers = parts.map(p => surfaceSampler(p.mesh.geometry));
  const edges = parts.map(p => edgeSampler(p.mesh.geometry));

  const totalEdge = edges.reduce((s, x) => s + x.length, 0);
  const tint = new THREE.Color(), c = new THREE.Color();

  parts.forEach((p, k) => {
    const focus = STAR_FOCUS.find(f => f.match(p.mesh.userData)) ?? { count: 1, glow: 1 };
    const ornament = p.dayKey === 'gold';
    const ns = Math.max(4, Math.round(CASTLE_STAR_COUNT * (1 - EDGE_SHARE) * samplers[k].area / totalArea * focus.count * (ornament ? ORNAMENT_SURFACE : 1)));
    const ne = edges[k].length && !ornament ? Math.max(2, Math.round(CASTLE_STAR_COUNT * EDGE_SHARE * edges[k].length / totalEdge * focus.count)) : 0;

      spark[j] = Math.pow(Math.random(), onEdge ? 5 : 3);     // most stars quiet, a few restless; edges steadier
      size[j] = (onEdge ? 1.25 : 0.9) + spark[j] * 1.4 + Math.pow(Math.random(), 8) * 2.4;
      glow[j] = (onEdge ? 1.6 : 0.8) * focus.glow * (ornament ? ORNAMENT_GLOW : 1);
      phase[j] = Math.random() * 100;
      c.copy(tint).offsetHSL((Math.random() - 0.5) * 0.04, 0, (Math.random() - 0.5) * 0.12);
      c.toArray(col, j * 3);

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
    geo.setAttribute('spark', new THREE.BufferAttribute(spark, 1));
    geo.setAttribute('glow', new THREE.BufferAttribute(glow, 1));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

    const pts = new THREE.Points(geo, castleStarMat);

    p.mesh.add(pts);
    p.stars = pts;
    p.mesh.userData.starPoints = pts;
    if (p.mesh.userData.glass) colorStarsFromGlass(p);
  });

// ---------- Magic: LED-studded roofs ----------
const ROOF_LED_COUNT = innerWidth < 800 ? 30000 : 60000;

fireworks.visible = false;

{

  if (nowSec >= nextLaunch) {
    const b = bursts.find(x => nowSec > x.explodeAt + x.mat.uniforms.uLife.value) ?? bursts[0];
    const h = castleHeight, U = b.mat.uniforms;
    // always behind the castle as seen from the camera, scattered left/right
    const away = controls.target.clone().sub(camera.position).setY(0).normalize();
    const side = new THREE.Vector3(-away.z, 0, away.x);
    U.uOrigin.value.copy(controls.target).setY(0)
      .addScaledVector(away, h * (0.5 + Math.random() * 0.9))
      .addScaledVector(side, (Math.random() * 2 - 1) * h * 1.2)
      .setY(h * (1.05 + Math.random() * 0.6));
    const [a, c] = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    U.uColorA.value.setHex(a); U.uColorB.value.setHex(c);
    U.uRadius.value = h * (0.22 + Math.random() * 0.18);
    U.uGravity.value = h * 0.07;
    U.uRise.value = 0.8 + Math.random() * 0.5;
    U.uLife.value = 2.2 + Math.random() * 0.8;
    U.uStart.value = nowSec;
    b.explodeAt = nowSec + U.uRise.value;
    nextLaunch = nowSec + (Math.random() < 0.25 ? 0.15 : 0.5 + Math.random() * 1.2);   // sometimes a double
  }
  // the latest burst briefly lights the castle in its colour
  let best = null, strength = 0;
  for (const b of bursts) {
    const k = 1 - (nowSec - b.explodeAt) / 0.7;
    if (k > 0 && k <= 1 && k > strength) { strength = k; best = b; }
  }
  fireworkFlash.intensity = best ? strength * strength * 1.6 : 0;
  if (best) {
    fireworkFlash.position.copy(best.mat.uniforms.uOrigin.value);
    fireworkFlash.color.copy(best.mat.uniforms.uColorA.value);
  }
}

// ---------- Load the castle ----------
const castle = new THREE.Group();          // Z-up model space
castle.rotation.x = -Math.PI / 2;           // -> Y-up world
scene.add(castle);
let castleBaseY = 0;
const parts = [];                           // { mesh, layer, offset: Vector3 }

loadCastle().catch(err => {
  console.error(err);
  document.getElementById('loadText').textContent = 'Could not load ' + MODEL_URL;
});

async function loadCastle() {
  const buf = await fetchWithProgress(MODEL_URL);
  const dv = new DataView(buf);
  const jsonLen = dv.getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, jsonLen)));
  const posStart = 4 + jsonLen;
  const q = new Uint16Array(buf, posStart, header.positionsBytes / 2);
  const idx = new Uint16Array(buf, posStart + header.positionsBytes, header.indicesBytes / 2);
  const [mx, my, mz] = header.min, [sx, sy, sz] = header.scale;

  // Centers of each sub-assembly, used to push them outward when exploding.
  const groupCenters = {};
  const all = new THREE.Box3();
  for (const p of header.parts) {
    const key = subKey(p.path);
    (groupCenters[key] ??= { sum: new THREE.Vector3(), n: 0 }).sum.add(new THREE.Vector3(...p.center));
    groupCenters[key].n++;
  }

  for (const p of header.parts) {
    const [v0, vn] = p.v, [i0, iN] = p.i;
    const pos = new Float32Array(vn * 3);
    for (let k = 0; k < vn; k++) {
      const s = (v0 + k) * 3;
      pos[k * 3] = mx + q[s] * sx;
      pos[k * 3 + 1] = my + q[s + 1] * sy;
      pos[k * 3 + 2] = mz + q[s + 2] * sz;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx.slice(i0, i0 + iN), 1));
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    if (!/^ROCHERS\/Colline|^BASE\/Rampe d'acces|^BASE\/Bassin/.test(p.path)) all.union(geo.boundingBox);   // frame the castle itself, not the bridge or scenery in front

    const key = dayKey(p), bronze = isBronze(p);
    const night = bronze ? BRONZE.night : MATS[p.mat] ?? MATS.stone, day = bronze ? BRONZE.day : DAY_MATS[key];
    const mesh = new THREE.Mesh(geo, mode === 'day' ? day : night);
    mesh.castShadow = mesh.receiveShadow = p.mat !== 'lantern';
    mesh.userData = { name: p.name, path: p.path, night, day, magic: bronze ? (key === 'roof' ? BRONZE.magic : BRONZE.day) : MAGIC_MATS[key] };
    castle.add(mesh);
    parts.push({ mesh, layerName: p.path.split('/')[0], key: subKey(p.path), dayKey: key });
  }

  // Compute explode offsets now that we know the castle's footprint.
  const center = all.getCenter(new THREE.Vector3());
  for (const part of parts) {
    const L = LAYERS[part.layerName] ?? { lift: 0, spread: 120, order: 1 };
    const g = groupCenters[part.key];
    const c = g.sum.clone().divideScalar(g.n);
    const dir = new THREE.Vector2(c.x - center.x, c.y - center.y);
    if (dir.lengthSq() < 1) dir.set(1, 0);
    dir.normalize().multiplyScalar(L.spread);
    part.offset = new THREE.Vector3(dir.x, dir.y, L.lift);
    part.order = L.order;
  }

  // Sit the castle on the ground, centered on the origin.
  castleBaseY = -all.min.z;
  castle.position.set(-center.x, castleBaseY, center.y);
  ground.position.y = 0;
  const h = all.max.z - all.min.z;
  controls.target.set(0, h * 0.42, 0);
  // Open facing the front: the side of the main entrance (gate and drawbridge).
  const gate = new THREE.Vector3(), gateParts = header.parts.filter(p => p.path.startsWith('BASE/Entree principale'));
  gateParts.forEach(p => gate.add(new THREE.Vector3(...p.center)));
  const front = gateParts.length
    ? new THREE.Vector3(gate.x / gateParts.length - center.x, 0, -(gate.y / gateParts.length - center.y)).normalize()
    : new THREE.Vector3(0, 0, 1);                       // model Z-up -> world: (x, z, -y)
  camera.position.copy(controls.target).addScaledVector(front, h * 1.85).add(new THREE.Vector3(0, h * 0.12, 0));
  castleHeight = h;
  placeUplights(front, h);
  placeShineBeams(front, h);
  placeTalesLasers(front, h);
  moon.target.position.set(0, h * 0.4, 0);

  const loader = document.getElementById('loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.remove(), 900);
  document.getElementById('explode').disabled = false;
  document.getElementById('enter').disabled = false;
  applyInterior();
  applyStainedGlass();   // textures load in the background
  applyTheme(mode);   // builds the star castle if the page opens in that mode
}

// ---------- Stained glass: SVG images mapped onto flat window parts ----------
// u / v say which model axis runs left-to-right and bottom-to-top across the
// image, seen from the front ('-y' = the model's y axis, reversed).
const STAINED_GLASS = [
  { path: 'BATIMENTS/Tour G/Corps batiment', name: 'Vitrail', svg: 'textures/vitrail-tour-g.svg', u: '-y', v: 'z' },
  { path: 'DONJON/Corps partie superieure', name: 'Vitrail gauche', svg: 'textures/vitrail-donjon.svg', u: '-y', v: 'z' },  // front
  { path: 'DONJON/Corps partie superieure', name: 'Vitrail droit', svg: 'textures/vitrail-donjon.svg', u: 'y', v: 'z' },    // back
];
const GLASS_TEX_W = 600, GLASS_TEX_H = 1000;

async function applyStainedGlass() {
  for (const g of STAINED_GLASS) {
    const part = parts.find(p => p.mesh.userData.path === g.path && p.mesh.userData.name === g.name);
    if (!part) continue;
    try {
      const img = new Image();
      img.src = g.svg;
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = GLASS_TEX_W; canvas.height = GLASS_TEX_H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, GLASS_TEX_W, GLASS_TEX_H);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const geo = part.mesh.geometry;
      const uvOf = planarUV(geo.boundingBox, g.u, g.v);
      const P = geo.attributes.position.array, uv = new Float32Array(P.length / 3 * 2);
      for (let i = 0; i < uv.length / 2; i++) uv.set(uvOf(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]), i * 2);
      geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

      // Glass lets light through: a little glow by day, backlit at night.
      const day = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff,
        emissiveIntensity: 0.3, roughness: 0.25, flatShading: true });
      const night = day.clone();
      night.emissiveIntensity = 1.6;

      if (hovered === part.mesh) setHover(null);
      const ud = part.mesh.userData;
      ud.day = day; ud.night = night; ud.magic = night;
      if (mode !== 'stars') part.mesh.material = ud[mode];
      ud.glass = { pixels: ctx.getImageData(0, 0, GLASS_TEX_W, GLASS_TEX_H).data, uvOf };
      if (blueprintBuilt) { ud.blueprint = blueprintGlassMat(tex); if (mode === 'blueprint') part.mesh.material = ud.blueprint; }
      if (shineBuilt) { ud.shine = shineMaterial(ud.magic); if (mode === 'shine') part.mesh.material = ud.shine; }
      if (talesBuilt) { ud.tales = talesMaterial(ud.magic, 'glass'); if (mode === 'tales') part.mesh.material = ud.tales; }
      if (part.stars) colorStarsFromGlass(part);
    } catch (e) {
      showError(e);
    }

}

function planarUV(box, uAxis, vAxis) {
  const axis = a => ({ i: 'xyz'.indexOf(a.slice(-1)), flip: a[0] === '-' });
  const U = axis(uAxis), V = axis(vAxis);
  const lo = box.min.toArray(), hi = box.max.toArray();
  const f = (A, c) => A.flip ? (hi[A.i] - c[A.i]) / (hi[A.i] - lo[A.i]) : (c[A.i] - lo[A.i]) / (hi[A.i] - lo[A.i]);
  return (x, y, z) => [f(U, [x, y, z]), f(V, [x, y, z])];
}

// Star mode: the window's stars take the colours of its glass.
function colorStarsFromGlass(part) {
  const { pixels, uvOf } = part.mesh.userData.glass;
  const pos = part.stars.geometry.attributes.position, col = part.stars.geometry.attributes.color;
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const [u, v] = uvOf(pos.getX(i), pos.getY(i), pos.getZ(i));
    const px = Math.min(GLASS_TEX_W - 1, Math.max(0, Math.floor(u * GLASS_TEX_W)));
    const py = Math.min(GLASS_TEX_H - 1, Math.max(0, Math.floor((1 - v) * GLASS_TEX_H)));
    const k = (py * GLASS_TEX_W + px) * 4;
    c.setRGB(pixels[k] / 255, pixels[k + 1] / 255, pixels[k + 2] / 255, THREE.SRGBColorSpace);
    c.toArray(col.array, i * 3);
  }
  col.needsUpdate = true;
}

// ---------- Interior: textured floors, walls and vaults ----------
// Procedural textures (drawn on a canvas, nothing to download). Each listed part
// gets a shader that picks a texture by face direction: floor (facing up),
// ceiling (facing down) or wall, projected along the face's main axis, in mm.
// The ceiling is only painted on: the rib vault and tree-like columns aren't modelled.
const INTERIOR = [
  // Passage under the castle, from the drawbridge to the back: stone paving, ashlar walls, rib vault
  ...['Couloir avant', 'Couloir partie arriere'].map(name => ({ name, floor: 'flagstones', wall: 'ashlar', ceil: 'vault',
    tint: { day: 0xffffff, night: 0x9896bb, magic: 0xe6dcf2 } })),
  { name: 'Pont levis', floor: 'planks', wall: 'planks', ceil: 'planks', tint: { day: 0xffffff, night: 0x8a86a8, magic: 0xd0c8e0 } },
  // Courtyard: light paving on top of the platform, in the castle's own colours
  ...['A1', 'A2', 'A3', 'A4'].map(n => ({ name: 'Plateforme ' + n, floor: 'paving' })),
];
const INTERIOR_SCALE = { flagstones: 48, ashlar: 40, vault: 34, planks: 60, paving: 36 };   // mm per repeat (vault: one bay)

function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// Rows of blocks of random width that tile seamlessly (used by flagstones, ashlar, paving)
function drawCourses(ctx, S, rnd, rowH, minW, maxW, fill, joint, jw) {
  ctx.fillStyle = joint; ctx.fillRect(0, 0, S, S);
  let y = 0;
  for (const h of rowH) {
    let x = rnd() * S, start = x;
    while (x < start + S) {
      const w = Math.min(minW + rnd() * (maxW - minW), start + S - x);
      for (const dx of [0, -S]) {
        ctx.fillStyle = fill(rnd);
        ctx.fillRect(x + dx + jw / 2, y + jw / 2, w - jw, h - jw);

  rows.push(left);

const INTERIOR_TEXTURES = {
  flagstones(ctx, S, rnd) {   // dark, worn, slightly bluish slabs (gate passage)
    drawCourses(ctx, S, rnd, splitRows(S, rnd, 60, 110), 70, 170,
      r => `hsl(${210 + r() * 25}, ${6 + r() * 8}%, ${34 + r() * 16}%)`, '#22222a', 5);
    speckle(ctx, S, rnd, 5000, 0.18);
  },
  ashlar(ctx, S, rnd) {       // warm grey-beige stone blocks
    drawCourses(ctx, S, rnd, Array(8).fill(S / 8), 80, 150,
      r => `hsl(${30 + r() * 15}, ${10 + r() * 10}%, ${62 + r() * 14}%)`, '#7c7164', 4);
    speckle(ctx, S, rnd, 6000, 0.14);
  },
  vault(ctx, S, rnd) {        // one bay of a rib vault: cream cells strewn with small painted flowers, pale pink ribs
    ctx.fillStyle = '#f3e2c8'; ctx.fillRect(0, 0, S, S);
    const g = ctx.createRadialGradient(S / 2, S / 2, S * 0.05, S / 2, S / 2, S * 0.7);   // cells shade towards the ribs
    g.addColorStop(0, 'rgba(255,250,235,0.5)'); g.addColorStop(1, 'rgba(190,140,110,0.25)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    const flower = (x, y, r, col) => {
      ctx.fillStyle = col;
      for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.7, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#f6d36b'; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, Math.PI * 2); ctx.fill();
    };
    for (let i = 0; i < 70; i++) {
      const x = rnd() * S, y = rnd() * S, t = rnd();
      if (t < 0.35) {   // leaf sprig
        ctx.strokeStyle = '#6f9a6a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y - 8); ctx.stroke();
        ctx.fillStyle = '#7fae74'; ctx.beginPath(); ctx.ellipse(x + 9, y - 9, 5, 2.5, -Math.PI / 4, 0, Math.PI * 2); ctx.fill();
      } else flower(x, y, 2.6 + rnd() * 1.6, t < 0.7 ? '#8d9fe0' : '#e59ab3');
    }

      for (const [col, lw] of [['#b98a78', w + 6], ['#ecc8b2', w], ['#fbe6d6', w * 0.35]]) {
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(...pts[0]); for (const q of pts.slice(1)) ctx.lineTo(...q); ctx.stroke();
      }

    rib([[0, m], [S, m]], 10); rib([[m, 0], [m, S]], 10);               // ridge ribs
    rib([[0, 0], [S, S]], 16); rib([[S, 0], [0, S]], 16);               // diagonal ribs
    for (const e of [0, S]) { rib([[0, e], [S, e]], 22); rib([[e, 0], [e, S]], 22); }   // transverse arches on the tile edges
    for (const [x, y, r] of [[m, m, 22], [0, 0, 20], [S, 0, 20], [0, S, 20], [S, S, 20]]) {   // carved bosses
      ctx.fillStyle = '#c99a86'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f1d2bd'; ctx.beginPath(); ctx.arc(x, y, r * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d9ad96';
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.45, r * 0.16, 0, Math.PI * 2); ctx.fill(); }
    }
  },
  planks(ctx, S, rnd) {       // weathered grey-brown boards, across the walkway
    const n = 8, w = S / n;
    ctx.fillStyle = '#2a221c'; ctx.fillRect(0, 0, S, S);
    for (let i = 0; i < n; i++) {
      const l = 40 + rnd() * 14;
      ctx.fillStyle = `hsl(${26 + rnd() * 10}, ${14 + rnd() * 10}%, ${l}%)`;
      ctx.fillRect(i * w + 2, 0, w - 4, S);
      for (let g = 0; g < 14; g++) {   // grain
        ctx.strokeStyle = `rgba(30,20,10,${0.12 + rnd() * 0.15})`; ctx.lineWidth = 1 + rnd();
        const gx = i * w + 4 + rnd() * (w - 8);

      }
      const cut = rnd() * S;   // board end
      ctx.fillStyle = '#2a221c'; ctx.fillRect(i * w + 2, cut, w - 4, 3);
    }
  },
  paving(ctx, S, rnd) {       // light, near-white cobbles: keeps the castle's own colour underneath
    drawCourses(ctx, S, rnd, Array(10).fill(S / 10), 40, 70,
      r => `hsl(0, 0%, ${84 + r() * 16}%)`, '#9a9aa2', 4);
    speckle(ctx, S, rnd, 3000, 0.08);
  },
};
const interiorTexCache = {};
function interiorTexture(kind) {
  if (!kind) return null;
  if (interiorTexCache[kind]) return interiorTexCache[kind];
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  INTERIOR_TEXTURES[kind](c.getContext('2d'), S, mulberry(kind.length * 7919 + 17));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return interiorTexCache[kind] = t;
}
const WHITE_TEX = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
WHITE_TEX.needsUpdate = true;

function interiorMaterial(base, cfg, tint) {
  const m = base.clone();
  if (tint !== undefined) m.color.setHex(tint);
  const uni = {
    tFloor: { value: interiorTexture(cfg.floor) ?? WHITE_TEX },
    tWall: { value: interiorTexture(cfg.wall) ?? WHITE_TEX },
    tCeil: { value: interiorTexture(cfg.ceil) ?? WHITE_TEX },
    uScale: { value: new THREE.Vector3(...['floor', 'wall', 'ceil'].map(k => 1 / (INTERIOR_SCALE[cfg[k]] ?? 1))) },
  };
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vLocal;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLocal = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vLocal;\nuniform sampler2D tFloor, tWall, tCeil;\nuniform vec3 uScale;')
      .replace('#include <map_fragment>', `#include <map_fragment>
      {
        vec3 tn = normalize(cross(dFdx(vLocal), dFdy(vLocal)));   // face normal, model space (z up)
        vec3 an = abs(tn);
        vec2 p = an.z > max(an.x, an.y) ? vLocal.xy : (an.x > an.y ? vLocal.yz : vLocal.xz);
        vec3 f = texture2D(tFloor, p * uScale.x).rgb;
        vec3 w = texture2D(tWall, p * uScale.y).rgb;
        vec3 c = texture2D(tCeil, p * uScale.z).rgb;
        diffuseColor.rgb *= tn.z > 0.6 ? f : (tn.z < -0.3 ? c : w);

}

function applyInterior() {
  for (const cfg of INTERIOR) {
    const part = parts.find(p => p.mesh.userData.name === cfg.name);
    if (!part) continue;
    const ud = part.mesh.userData;
    for (const m of ['day', 'night', 'magic']) ud[m] = interiorMaterial(ud[m], cfg, cfg.tint?.[m]);
    if (mode !== 'stars') part.mesh.material = ud[mode];
  }
}

// ---------- Blueprint: a pencil drawing on old paper ----------
// The castle is filled with the paper colour, its sharp edges drawn as graphite
// lines, with pencil hatching on the faces turned away from the light and
// darker strokes where a surface turns away from the eye (the contours).
const PAPER = new THREE.Color('#ece5d1'), INK = new THREE.Color('#34333d'), BLUE_PENCIL = new THREE.Color('#3d5fa8');

  const W = 1024, H = 1024, c = document.createElement('canvas');
  c.width = W; c.height = H;

  ctx.fillStyle = '#ece5d1'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) {   // soft mottling
    const x = rnd() * W, y = rnd() * H, r = 30 + rnd() * 120;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.025 + rnd() * 0.03, dark = rnd() < 0.5;

    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);

  const away = controls.target.clone().sub(camera.position).setY(0).normalize();
  droneAway.lerp(away, Math.min(1, dt * 0.8)).normalize();

function subKey(path) { return path.split('/').slice(0, 2).join('/'); }

async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status + ' ' + url);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  const bar = document.querySelector('#bar i');
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) bar.style.width = Math.min(100, got / total * 100) + '%';
  }
  let blob = new Blob(chunks);
  const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {   // gzip magic: unpack in the browser
    blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
  }
  return blob.arrayBuffer();
}

let exploded = false, animT = 0, animating = false;
const maxOrder = Math.max(...Object.values(LAYERS).map(l => l.order));
const totalTime = EXPLODE_TIME + LAYER_DELAY * maxOrder;

const explodeBtn = document.getElementById('explode');

  exploded = !exploded;
  animating = true;

});

function updateExplode(dt) {
  if (!animating) return;
  animT = THREE.MathUtils.clamp(animT + (exploded ? dt : -dt), 0, totalTime);
  for (const p of parts) {
    // Exploding: top layers leave first. Assembling: they return last.
    const delay = (maxOrder - p.order) * LAYER_DELAY;
    const k = ease(THREE.MathUtils.clamp((animT - delay) / EXPLODE_TIME, 0, 1));
    p.mesh.position.copy(p.offset).multiplyScalar(k);
  }
  if (animT === 0 || animT === totalTime) animating = false;
}

// ---------- Enter: a travelling shot through the castle ----------
// The camera glides in from where it is, crosses the drawbridge, goes under the
// portcullis and through the vaulted passage, comes out on the back terrace, then
// rises and turns round to look up at the keep. Click Enter again, or drag, to stop.
// Points are in model coordinates (mm, z up; the front faces -x). The passage is
// clear at z -48: the portcullis and arches start higher, the back railing lower.
const TRAVEL_TIME = 16;   // seconds

  [30, 0, -48], [150, 0, -48], [250, 0, -42], [400, 25, 40], [560, 110, 230]];

function startTravel() {
  // Put the castle back together and stop spinning first
  if (exploded || animating) {
    exploded = animating = false; animT = 0;
    for (const p of parts) p.mesh.position.set(0, 0, 0);
    explodeBtn.textContent = 'Explode';
  }
  controls.autoRotate = false;
  spinBtn.classList.remove('primary');
  heightInput.value = 0; heightShift = 0;
  const local = v => castle.worldToLocal(v.clone());
  const P = [local(camera.position), ...TRAVEL_CAMERA.map(p => new THREE.Vector3(...p))];
  const L = [local(controls.target), ...TRAVEL_LOOK.map(p => new THREE.Vector3(...p))];
  travel = { t: 0, cam: new THREE.CatmullRomCurve3(P, false, 'centripetal'), look: new THREE.CatmullRomCurve3(L, false, 'centripetal') };

  setHover(null);

  if (!travel) return;
  // Hand the camera back to the orbit controls, looking where the shot was looking
  const look = castle.localToWorld(travel.look.getPoint(ease(Math.min(travel.t / TRAVEL_TIME, 1))));
  controls.target.copy(look);
  if (camera.position.distanceTo(look) < controls.minDistance)
    camera.position.copy(look).add(camera.position.clone().sub(look).setLength(controls.minDistance));
  travel = null;
  controls.enabled = true;
  camera.near = 5; camera.fov = 38; camera.updateProjectionMatrix();
  enterBtn.classList.remove('primary');
  enterBtn.textContent = 'Enter';

  travel.t += dt;

  camera.position.copy(castle.localToWorld(travel.cam.getPoint(k)));
  camera.lookAt(castle.localToWorld(travel.look.getPoint(k)));
  // wider lens inside the castle
  const inside = THREE.MathUtils.smoothstep(k, 0.15, 0.3) * (1 - THREE.MathUtils.smoothstep(k, 0.62, 0.76));
  camera.fov = 38 + 22 * inside;
  camera.updateProjectionMatrix();

    vertexShader: `
      attribute float size; attribute float phase; attribute vec3 color;
      uniform float uTime; uniform float uPR; uniform float uDim; uniform float uSize; varying float vA; varying vec3 vC;
      void main() {
        vA = (0.55 + 0.45 * sin(uTime * (0.6 + fract(phase) * 2.0) + phase)) * uDim;
        vC = color;
        gl_PointSize = max(1.0, size * uSize * uPR);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying float vA; varying vec3 vC;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vC, a * a * vA);
      }`,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  return pts;
}
