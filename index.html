<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle by Night</title>
<style>
  :root { --ink: #dfe3ff; --dim: #8f93c4; --glass: rgba(14, 14, 38, 0.55); --edge: rgba(170, 160, 255, 0.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05050f; color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .ui { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(10px); }
  button { appearance: none; border: 1px solid var(--edge); background: rgba(120, 110, 255, 0.12);
    color: var(--ink); font: inherit; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  button:hover { background: rgba(150, 140, 255, 0.25); box-shadow: 0 0 18px rgba(140, 130, 255, 0.35); }
  button.primary { background: rgba(150, 140, 255, 0.28); }
  button:disabled { opacity: .4; cursor: default; }
  /* Title on the left, hints on the right; on phones the hints go under the title, whatever its length */
  .top { position: fixed; top: 22px; left: 28px; right: 28px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 16px; pointer-events: none; }
  h1 { margin: 0; font-weight: 300; font-size: 15px; letter-spacing: .35em; text-transform: uppercase; color: var(--dim); }
  #label { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 8px;
    background: var(--glass); border: 1px solid var(--edge); font-size: 12px; white-space: nowrap;
    opacity: 0; transition: opacity .15s; }
  #label small { display: block; color: var(--dim); }
  #loader { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
    color: var(--dim); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; transition: opacity .8s; }
  #bar { width: 220px; height: 2px; background: rgba(255,255,255,.08); overflow: hidden; border-radius: 2px; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7b6cff, #b9e2ff);
    box-shadow: 0 0 12px #9b8cff; transition: width .2s; }
  .hint { color: var(--dim); font-size: 12px; text-align: right; }
  .seg { display: flex; gap: 4px; padding-left: 10px; border-left: 1px solid var(--edge); }
  .seg button { padding: 10px 16px; }
  .seg button.active { background: rgba(170, 160, 255, 0.4); box-shadow: inset 0 0 0 1px rgba(200, 190, 255, 0.5); }
  body.day .seg button.active { background: #fff; }
  #err { display: none; position: fixed; top: 60px; left: 28px; right: 28px; max-height: 40vh; overflow: auto; margin: 0;
    padding: 12px; border-radius: 8px; background: rgba(60, 0, 20, 0.85); color: #ffd6de; font: 12px/1.4 ui-monospace, monospace;
    white-space: pre-wrap; user-select: text; z-index: 10; }
  .actions { display: flex; gap: 10px; }
  #time { white-space: nowrap; }
  .hint .touch { display: none; }
  @media (pointer: coarse) { .hint .mouse { display: none; } .hint .touch { display: inline; } }
  /* Phones and narrow windows: hint under the title, menu on two rows */
  .burger { display: none; }
  @media (max-width: 720px) {
    .top { top: calc(14px + env(safe-area-inset-top)); left: 16px; right: 16px; flex-direction: column; gap: 6px; }
    h1 { font-size: 13px; letter-spacing: .28em; line-height: 1.5; }
    .hint { text-align: left; font-size: 11px; }
    /* Phones: the menu folds into a burger button, bottom right, within thumb reach */
    .burger { display: grid; place-items: center; position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
      width: 54px; height: 54px; padding: 0; border-radius: 50%; z-index: 6;
      background: var(--glass); backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25); }
    body.menu-open .burger { background: rgba(170, 160, 255, 0.45); }
    .ui { display: none; flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; border-radius: 22px;
      left: 12px; right: 12px; transform: none; bottom: calc(78px + env(safe-area-inset-bottom));
      max-height: calc(100vh - 140px); overflow-y: auto; z-index: 5; }
    body.menu-open .ui { display: flex; }
    .actions, .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .seg { padding: 10px 0 0; border-left: 0; border-top: 1px solid var(--edge); grid-template-columns: repeat(3, 1fr); }
    button, .seg button { padding: 11px 8px; font-size: 12px; letter-spacing: .06em; }
    #err { top: 70px; left: 12px; right: 12px; }
  }
  .height { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column;
    align-items: center; gap: 8px; padding: 12px 8px; border-radius: 999px; background: var(--glass);
    border: 1px solid var(--edge); backdrop-filter: blur(10px); color: var(--dim); font-size: 10px;
    letter-spacing: .12em; text-transform: uppercase; }
  .height input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 180px; margin: 0;
    accent-color: #9b8cff; cursor: ns-resize; }
  @media (max-width: 720px) { .height { right: 8px; padding: 10px 4px; } .height input { height: 130px; } }
  /* Blueprint: drawing-sheet frame with grid references */
  #sheet { display: none; position: fixed; inset: 10px; pointer-events: none; border: 1px solid rgba(52, 51, 61, .5);
    font: 11px/1 Georgia, "Times New Roman", serif; color: rgba(52, 51, 61, .75); }
  body.paper #sheet { display: block; }
  #sheet::after { content: ''; position: absolute; inset: 16px; border: 1.5px solid rgba(52, 51, 61, .7); }
  #sheet .ref { position: absolute; transform: translate(-50%, -50%); }
  #sheet .ref.top { top: 8px; } #sheet .ref.bottom { top: calc(100% - 8px); }
  #sheet .ref.left { left: 8px; } #sheet .ref.right { left: calc(100% - 8px); }
  #sheet .tick { position: absolute; background: rgba(52, 51, 61, .55); }
  #sheet .tick.top, #sheet .tick.bottom { width: 1px; height: 16px; } #sheet .tick.top { top: 0; } #sheet .tick.bottom { bottom: 0; }
  #sheet .tick.left, #sheet .tick.right { height: 1px; width: 16px; } #sheet .tick.left { left: 0; } #sheet .tick.right { right: 0; }
  body.paper h1 { font-family: Georgia, "Times New Roman", serif; }
  body.paper .top { top: 38px; left: 44px; right: 44px; }
  body.cyan #sheet { border-color: rgba(238, 244, 255, .5); color: rgba(238, 244, 255, .8); }
  body.cyan #sheet::after { border-color: rgba(238, 244, 255, .7); }
  body.cyan #sheet .tick { background: rgba(238, 244, 255, .55); }
  #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  body.day { --ink: #1f2547; --dim: #4b557e; --glass: rgba(255, 255, 255, 0.55); --edge: rgba(40, 60, 130, 0.22); }
  body.day button { background: rgba(255, 255, 255, 0.35); }
  body.day button:hover { background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 18px rgba(255, 255, 255, 0.6); }
  body.day button.primary { background: rgba(255, 255, 255, 0.75); }
</style>

<body>
<header class="top">
<h1>Castle by Night</h1>
<div class="hint"><span class="mouse">Drag to orbit · Scroll to zoom · Right-drag to pan</span><span class="touch">Drag to orbit · Pinch to zoom · Two-finger drag to pan</span></div>
</header>
<div id="loader"><span id="loadText">Summoning the castle</span><div id="bar"><i></i></div></div>
<div id="label"></div>
<div id="fade"></div>
<pre id="err"></pre>
<div id="sheet"></div>
<label class="height" title="Raise or lower the castle (double-click to reset)">
  <span>Height</span>
  <input id="height" type="range" min="-100" max="100" value="0" step="1">
</label>
<button id="menu" class="burger" aria-label="Menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<div class="ui">
  <span class="actions">
    <button id="explode" class="primary" disabled>Explode</button>
    <button id="spin">Spin</button>
    <button id="enter" disabled title="Travel through the castle">Enter</button>
    <button id="labels" class="primary" title="Highlight parts and show their names on hover">Labels</button>
    <button id="time" title="Switch between day and night">☀️ Day</button>
  </span>
  <span class="seg">
    <button data-mode="day">Normal</button>
    <button data-mode="night">Closed</button>
    <button data-mode="stars">Stars</button>
    <button data-mode="magic">Magic</button>
    <button data-mode="blueprint">Blueprint</button>
    <button data-mode="shine">Shine</button>
    <button data-mode="tales">Electro</button>
    <button data-mode="xmas">Xmas</button>
  </span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const MODEL_URL = 'models/castle.bin.gz';

// ---------- Explode settings (units: mm, model is Z-up) ----------
// Each top-level folder is a layer. Layers lift apart vertically; within a
// layer, each sub-assembly (second-level folder) slides outward from the center.
const LAYERS = {
  ROCHERS:   { lift: -160, spread: 140, order: 0 },
  BASE:      { lift:    0, spread: 190, order: 1 },
  BATIMENTS: { lift:  260, spread: 170, order: 2 },
  DONJON:    { lift:  560, spread:  60, order: 3 },
};
const EXPLODE_TIME = 1.6;   // seconds per layer
const LAYER_DELAY  = 0.35;  // stagger between layers

// ---------- Errors are shown on screen (easier to report than the console) ----------
function showError(e) {
  console.error(e);
  const box = document.getElementById('err');
  box.textContent += (e && (e.stack || e.message) || String(e)) + '\n';
  box.style.display = 'block';
}
addEventListener('error', ev => showError(ev.error || ev.message));
addEventListener('unhandledrejection', ev => showError(ev.reason));

// ---------- Renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', () => showError('WebGL context lost: the graphics card stopped rendering this page.'));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0a22, 0.00045);
const SKY_NIGHT = skyTexture(['#02020a', '#0a0a26', '#1b1446', '#2a1d55']);
const SKY_DAY = skyTexture(['#3f74c4', '#6f9fdd', '#a9c9ee', '#e4edf6']);
const SKY_WINTER = skyTexture(['#5d8fd0', '#94bbe8', '#cfe0f4', '#f2f6fb']);   // clear, pale winter morning
const SKY_GOLDEN = skyTexture(['#34388a', '#e8785e', '#ffb070', '#ffd9a0']);   // end of the day: violet overhead, glowing horizon
scene.background = SKY_NIGHT;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 5, 20000);
camera.position.set(900, 700, 1300);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.92;   // below the ground too, for low-angle views
controls.minDistance = 200;
controls.maxDistance = 4000;
controls.autoRotateSpeed = 0.5;

// ---------- Lights: cold moonlight + violet ambience ----------
const hemi = new THREE.HemisphereLight(0x7d86ff, 0x1a0f2e, 0.9);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xc6d4ff, 2.4);
moon.position.set(-700, 1100, 500);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -700, right: 700, top: 1400, bottom: -500, near: 100, far: 3500 });
moon.shadow.bias = -0.0004;
moon.shadow.normalBias = 1.2;
scene.add(moon, moon.target);
const rim = new THREE.DirectionalLight(0x9a6bff, 1.1);
rim.position.set(800, 300, -900);
scene.add(rim);

// ---------- Moon disc ----------
const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(120, 64),
  new THREE.MeshBasicMaterial({ color: 0xe8ecff, fog: false }));
moonDisc.position.set(-3500, 2600, -5200);
moonDisc.lookAt(0, 0, 0);
scene.add(moonDisc);

// ---------- Low sun (golden hour): a warm disc with a soft halo, near the horizon ----------
const sunDisc = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d'), g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,250,225,1)'); g.addColorStop(0.12, 'rgba(255,236,180,1)'); g.addColorStop(0.16, 'rgba(255,190,110,0.55)');
  g.addColorStop(0.4, 'rgba(255,140,80,0.18)'); g.addColorStop(1, 'rgba(255,120,80,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  sp.position.set(6500, 280, -2000);   // left of the castle from the opening viewpoint
  sp.scale.setScalar(2600);
  sp.visible = false;
  scene.add(sp);
  return sp;
})();

// ---------- Starfield with twinkle ----------
const stars = makeStars(7000);
scene.add(stars);
const voidStars = makeStars(20000, true);   // all around, including below: star mode only
voidStars.visible = false;
scene.add(voidStars);

// ---------- Materials (night) ----------
const MATS = {
  stone:   new THREE.MeshStandardMaterial({ color: 0xb8b6d2, roughness: 0.85, flatShading: true }),
  roof:    new THREE.MeshStandardMaterial({ color: 0x334a86, roughness: 0.5, metalness: 0.25, flatShading: true }),
  timber:  new THREE.MeshStandardMaterial({ color: 0x5b4a5e, roughness: 0.9, flatShading: true }),
  iron:    new THREE.MeshStandardMaterial({ color: 0x2b2a3a, roughness: 0.4, metalness: 0.8, flatShading: true }),
  grass:   new THREE.MeshStandardMaterial({ color: 0x2f4a52, roughness: 1, flatShading: true }),
  rock:    new THREE.MeshStandardMaterial({ color: 0x67657e, roughness: 1, flatShading: true }),
  flag:    new THREE.MeshStandardMaterial({ color: 0xcfc8ff, emissive: 0x6a5cff, emissiveIntensity: 0.6, flatShading: true, side: THREE.DoubleSide }),
  lantern: new THREE.MeshStandardMaterial({ color: 0xbfe8ff, emissive: 0x9fdcff, emissiveIntensity: 2.2, flatShading: true }),
  water:   waterMat(0x24405e, 0.08, 0.45),
};

// ---------- Water: smooth, with small moving ripples (bent normals, no extra geometry) ----------
const waterUniforms = { uWaterTime: { value: 0 } };
function waterMat(color, roughness, metalness, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, waterUniforms);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWater, vWN, vWX, vWY;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vWater = position;
        vWN = normalize(normalMatrix * vec3(0.0, 0.0, 1.0));   // model z is up
        vWX = normalize(normalMatrix * vec3(1.0, 0.0, 0.0));
        vWY = normalize(normalMatrix * vec3(0.0, 1.0, 0.0));`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWater, vWN, vWX, vWY;\nuniform float uWaterTime;')
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      {
        float t = uWaterTime; vec2 p = vWater.xy;
        vec2 g = vec2(0.8, 0.3) * cos(dot(p, vec2(0.8, 0.3)) * 0.35 + t * 1.3)
               + vec2(-0.4, 0.9) * cos(dot(p, vec2(-0.4, 0.9)) * 0.5 + t * 1.7) * 0.7
               + vec2(0.6, -0.7) * cos(dot(p, vec2(0.6, -0.7)) * 0.9 - t * 2.1) * 0.4;
        normal = normalize(vWN - 0.12 * (g.x * vWX + g.y * vWY));
      }`);
  };
  m.customProgramCacheKey = () => 'water';
  return m;
}

// ---------- Materials (day): palette taken from the kit's colour renders ----------
const std = (color, roughness, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, flatShading: true, ...extra });
const DAY_MATS = {
  wall:    std(0xe4a79c, 0.75),          // powder pink walls (buildings, keep)
  base:    std(0xa4b5d9, 0.8),           // pale lavender-blue base walls
  trim:    std(0xf2ece1, 0.6),           // cream crenellations, cornices, columns
  roof:    std(0x2f6798, 0.45, 0.15),    // slate blue roofs
  gold:    std(0xd8b04a, 0.3, 0.85),     // finials, spires, flags
  timber:  std(0x6f4430, 0.85),
  tree:    std(0x4a2e22, 0.9),
  glass:   std(0x2c4e88, 0.15, 0.3),     // stained glass
  brick:   std(0xc4867b, 0.85),
  iron:    std(0x2c2c33, 0.4, 0.8),
  grass:   std(0x5f8b45, 1),
  hedge:   std(0x3b6a32, 0.95),          // topiary trees: dark clipped foliage
  rock:    std(0xcac7c2, 0.95),
  lantern: std(0xf4e6b8, 0.3, 0.2, { emissive: 0xffd98a, emissiveIntensity: 0.25 }),
  water:   waterMat(0x5fa595, 0.1, 0.15),    // green-turquoise, like the basin on the photos
};

// Magic: day colours under coloured floodlights, dark roofs for the LEDs, warm windows
const MAGIC_MATS = { ...DAY_MATS,
  roof:    std(0x18204f, 0.35, 0.45),
  lantern: std(0xffe2a0, 0.3, 0, { emissive: 0xffbf5a, emissiveIntensity: 2.6 }),
  glass:   std(0x2c4e88, 0.15, 0.3, { emissive: 0xffb860, emissiveIntensity: 0.9 }),
  water:   waterMat(0x102838, 0.06, 0.55),   // dark, catching the coloured lights
};

// Bronze / copper brown parts: the rotonde roof (not slate blue; the LEDs still light it in Magic)
// and the entrance sign by the grotto
const BRONZE = {
  night: new THREE.MeshStandardMaterial({ color: 0x6a4a52, roughness: 0.45, metalness: 0.5, flatShading: true }),
  day:   std(0x7b4a30, 0.4, 0.65),
  magic: std(0x4a2b22, 0.35, 0.6),
};
const isBronze = p => (p.path === 'BATIMENTS/Rotonde/Batiment/Toiture' && p.name === 'Toit')
  || (p.path === 'ROCHERS/Rochers/Entree bas' && p.name === 'Panneau entree');

function dayKey(p) {
  const n = p.name.toLowerCase(), layer = p.path.split('/')[0];
  if (/^feuillage/.test(n)) return 'hedge';
  if (/^rampe/.test(n)) return 'trim';               // the bridge's walkway, like its balcony ("Rampe balcon")
  if (p.mat === 'iron' || p.mat === 'lantern' || p.mat === 'grass' || p.mat === 'water') return p.mat;
  if (p.mat === 'rock' || /^rocher/.test(n)) return 'rock';
  if (/faitage|drapeau|chouette|sphere|cloche|^pointe|jonction pointe|^ornement/.test(n)) return 'gold';
  if (/arbre|branche|^tronc/.test(n)) return 'tree';
  if (/^muraille/.test(n)) return layer === 'BASE' ? 'base' : 'wall';
  if (/colombage|porte|pont levis|charpente|escalier bois|medaillon/.test(n)) return 'timber';
  if (/encadrement|garde corps/.test(n)) return 'trim';
  if (/vitra|vitres/.test(n)) return 'glass';
  if (/chemin|brique/.test(n)) return 'brick';
  if (/sous toit|arcades sous|arceaux|encadrements piliers|interieur sous|jonction etage et toit/.test(n)) return 'trim';
  if (p.mat === 'roof' || /^toit/.test(n)) return 'roof';
  if (/corps|^mur/.test(n)) return layer === 'BASE' ? 'base' : 'wall';
  if (/creneau|corniche|corbeau|colonne|^col\.|pilier|pilastre|balcon|arche|arcade|rambarde|main courante|encadrement|appui|linteau|meneau|moulure|culot|anneau|jonction|dessus|fenetre|fenestrou|garde corps|marches|escalier|support|voute|bordure|barreau/.test(n)) return 'trim';
  return layer === 'BASE' ? 'base' : 'wall';
}

// ---------- Ambiences: night, day, and a castle made of stars ----------
const SKY_VOID = skyTexture(['#000003', '#02020a', '#050414', '#08061a']);
const SKY_MAGIC = skyTexture(['#000002', '#02020e', '#070520', '#120c3a']);
const THEMES = {
  night: { sky: SKY_NIGHT, fog: 0x0b0a22, fogDensity: 0.00045, exposure: 1.05,
    hemi: [0x7d86ff, 0x1a0f2e, 0.9], key: [0xc6d4ff, 2.4, -700, 1100, 500], rim: [0x9a6bff, 1.1],
    ground: 0x0d0c22, bloom: [0.55, 0.82], stars: true, moon: true, title: 'Castle by Night', fade: '#05050f' },
  day:   { sky: SKY_DAY, fog: 0xd6e3f2, fogDensity: 0.00018, exposure: 1.0,
    hemi: [0xd8e8ff, 0x6d7b58, 1.4], key: [0xfff0d8, 3.2, 900, 1500, 700], rim: [0xbcd4ff, 0.5],
    ground: 0x83946f, bloom: [0.12, 0.95], stars: false, title: 'Castle by Day', fade: '#eef3fb' },
  stars: { sky: SKY_VOID, fog: 0x000000, fogDensity: 0, exposure: 1.0,
    hemi: [0x7d86ff, 0x1a0f2e, 0.9], key: [0xc6d4ff, 2.4, -700, 1100, 500], rim: [0x9a6bff, 1.1],

// ---------- Mode switch ----------
const matOf = (ud, m) => ud[THEMES[m].mats ?? m];   // a theme can reuse another's materials
function applyTheme(m) {
  const T = THEMES[m];
  mode = m;
  scene.background = T.sky;
  scene.fog.color.setHex(T.fog);
  scene.fog.density = T.fogDensity;
  renderer.toneMappingExposure = T.exposure;
  renderer.toneMapping = T.paper ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;   // keep the paper's true colours
  hemi.color.setHex(T.hemi[0]); hemi.groundColor.setHex(T.hemi[1]); hemi.intensity = T.hemi[2];
  moon.color.setHex(T.key[0]); moon.intensity = T.key[1]; moon.position.set(T.key[2], T.key[3], T.key[4]);
  rim.color.setHex(T.rim[0]); rim.intensity = T.rim[1];
  ground.visible = T.ground !== null;
  if (ground.visible) ground.material.color.setHex(T.ground);
  bloom.strength = T.bloom[0]; bloom.threshold = T.bloom[1];
  stars.visible = T.stars;
  voidStars.visible = !!T.voidStars;
  controls.maxPolarAngle = T.floating ? Math.PI : Math.PI * 0.92;   // orbit below ground level for low-angle views
  moonDisc.visible = !!T.moon;
  sunDisc.visible = !!T.sun;
  starUniforms.uDim.value = T.skyDim ?? 1;
  starUniforms.uSize.value = T.skySize ?? 1;
  setHover(null);
  if ((m === 'stars' || T.starsOver) && parts.length && !castleStarsBuilt) buildCastleStars();
  castleStarUniforms.uDay.value = T.starsOver ? 1 : 0;
  if (T.paper && parts.length && !blueprintBuilt) buildBlueprint();
  if (T.paper) {   // cream paper and graphite, or cyanotype blue and white
    blueprintUniforms.uPaper.value.set(T.cyan ? '#1f4f8f' : '#ece5d1');
    blueprintUniforms.uInk.value.set(T.cyan ? '#eef4ff' : '#34333d');
    blueprintUniforms.uBlue.value.set(T.cyan ? '#ffd36a' : '#3d5fa8');   // hover pencil
    blueprintLineMat.color.set(T.cyan ? '#eef4ff' : '#34333d');
    blueprintLineMat.opacity = T.cyan ? 0.85 : 0.75;
  }
  if (m === 'shine' && parts.length && !shineBuilt) buildShine();
  if (T.tales && parts.length && !talesBuilt) buildTales();
  neonUniforms.uGain.value = T.dayShow ? 0.6 : 1;   // by day, washed out on the sunlit walls
  lasers.visible = !T.dayShow;
  drones.material = T.dayShow ? droneDayMat : droneMat;
  if (T.snow && parts.length && !xmasBuilt) buildXmas();
  if (T.snow) snowMapDirty = true;
  xmasUniforms.uSnowGlow.value.setRGB(...(T.snowDay ? [0.07, 0.08, 0.1] : [0.22, 0.2, 0.3]));   // by day the sun does the work
  xmasUniforms.uGlint.value = T.snowDay ? 1.6 : 1;
  snowGeo.setDrawRange(0, T.snowDay ? FLAKES / 4 : FLAKES);   // only a few flakes left in the morning
  snowfall.visible = !!T.snow;
  if (T.tales && !talesGroup.visible) droneClock = 0;   // the drones take off again each time
  talesGroup.visible = !!T.tales;
  shineGroup.visible = !!T.beams;
  if (T.beams && parts.length && !tipMesh) findSpireTip();
  tipLight.intensity = T.beams ? setBeamLook(T.beams).lightI : 0;
  for (const u of UPLIGHTS) u.light.intensity = T.uplights ? u.intensity * (T.uplightScale ?? 1) : 0;
  fireworks.visible = !!T.fireworks;
  if (T.leds && parts.length && !roofLedsBuilt) buildRoofLeds();
  for (const p of parts) {
    p.mesh.material = m === 'stars' ? DEPTH_ONLY : matOf(p.mesh.userData, m);
    if (p.stars) p.stars.visible = m === 'stars' || !!T.starsOver;
    if (p.leds) p.leds.visible = !!T.leds;
    if (p.lines) p.lines.visible = !!T.paper;
    if (p.neon) p.neon.visible = !!T.tales;
  }
  if (!T.floating) castle.position.y = castleBaseY;
  document.body.classList.toggle('day', T.sky === SKY_DAY || !!T.lightUi || (T.paper && !T.cyan));   // dark text on light backgrounds
  document.body.classList.toggle('paper', !!T.paper);
  document.body.classList.toggle('cyan', !!T.cyan);
  document.querySelector('h1').textContent = T.title;
  document.title = T.title;
  updateModeButtons();
}

const timeBtn = document.getElementById('time');
function updateModeButtons() {
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === uiMode));
  timeBtn.disabled = !TIMES[uiMode];
  timeBtn.textContent = isNight ? '🌙 Night' : '☀️ Day';
}

// Fades out, switches to the look of mode button `ui` at that time, fades back in.
function goTo(ui, night) {
  const next = themeFor(ui, night);
  uiMode = ui; isNight = night;
  if (next === mode) { updateModeButtons(); return; }
  const fade = document.getElementById('fade');
  fade.style.background = THEMES[next].fade;
  fade.style.opacity = 1;
  setTimeout(() => {
    try { applyTheme(next); } catch (e) { showError(e); } finally { fade.style.opacity = 0; }
  }, 350);
}

document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
  const next = btn.dataset.mode;
  if (next === uiMode) return;
  goTo(next, TIMES[next] ? TIMES[next].start === 'night' : next !== 'day' && next !== 'blueprint');
}));
timeBtn.addEventListener('click', () => { if (TIMES[uiMode]) goTo(uiMode, !isNight); });

// ---------- Castle made of stars ----------
// Points are scattered evenly over every part's surface (area-weighted) and added
// as children of that part's mesh, so they follow the Explode animation. In this
// mode the mesh itself only writes depth: it stays invisible but hides the stars
// behind it, which keeps the silhouette readable.
const DEPTH_ONLY = new THREE.MeshBasicMaterial({ colorWrite: false });
const STAR_TINT = { water: 0x7fd8ff, hedge: 0x8fe0a8, gold: 0xffdca0, roof: 0xa8b8ff, glass: 0x9aaeff, grass: 0xa8e8d4, rock: 0xcfd0ee,
  tree: 0xd6c6ff, timber: 0xe6d4ff, lantern: 0xfff1c8, brick: 0xffc8d8, wall: 0xf1e8ff };
const CASTLE_STAR_COUNT = innerWidth < 800 ? 85000 : 160000;   // density of the star castle
const SURFACE_LIFT = 0.35;   // mm: keeps each star just in front of its surface
const EDGE_SHARE = 0.4;      // part of the stars that trace the castle's sharp edges (brighter, steadier)
const EDGE_ANGLE = 35;       // degrees: a fold sharper than this between two faces counts as an edge
// Spires, finials, crests: small ornate pieces whose sharp edges would trace boxy
// outlines. They get no edge stars; more and brighter surface stars instead.
const ORNAMENT_SURFACE = 2, ORNAMENT_GLOW = 1.5;
// Hand-tuned parts: count multiplies the number of stars, glow their brightness
const STAR_FOCUS = [
  { match: p => p.name === 'Rambarde pierre', count: 0.45, glow: 0.6 },   // long carved balustrade: too many edges
  { match: p => p.path === 'DONJON/Toiture' || (p.path === 'DONJON/Corps partie superieure' && p.name === 'Corps superieur'),
    count: 2.2, glow: 1.7 },                                              // top of the keep: spire, roof, upper body
  { match: p => p.path === 'ROCHERS/Colline', count: 0.4, glow: 0.8 },   // the big hill: keep it in the background
  { match: p => p.path === 'BASE/Bassin', count: 0.5, glow: 0.7 },       // the water: a faint shimmer
  { match: p => p.name.startsWith('Ornement'), count: 10, glow: 1.2 },   // gilded fleur-de-lys over the oval windows: tiny, needs more stars
  { match: p => STAINED_GLASS.some(g => g.path === p.path && g.name === p.name), count: 30, glow: 1.3 },   // stained glass: small and flat, needs many stars to show its pattern and oval rim (not too bright, or the colours wash out to white)
];
const castleStarUniforms = { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() },
  uScale: { value: 1300 }, uBright: { value: 1.95 }, uDay: { value: 0 } };   // uBright: overall star brightness
const castleStarMat = new THREE.ShaderMaterial({
  uniforms: castleStarUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size; attribute float phase; attribute float spark; attribute float glow; attribute float edge; attribute vec3 color;
    uniform float uTime, uPR, uScale, uDay; varying float vA; varying vec3 vC;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      // spark 0 = quiet star (dim, barely moves), 1 = restless star (fast, deep, sharp flashes)
      float speed = mix(0.3, 2.8, spark) * (0.8 + 0.4 * fract(phase * 7.3));
      float s = 0.5 + 0.5 * sin(uTime * speed + phase);
      s = pow(s, mix(1.0, 4.0, spark));
      float amp = mix(0.2, 1.0, spark);
      vA = mix(0.5, 1.0, spark) * ((1.0 - amp) + amp * s);
      // slow waves drifting through the castle: whole areas fade out and come back
      float wave = sin(position.z * 0.018 + position.x * 0.011 - uTime * 0.32)
                 * sin(position.y * 0.014 - position.z * 0.007 + uTime * 0.21);
      vA *= 0.72 + 0.28 * wave;
      // Outlines: edge stars carry a higher glow, and stars on surfaces seen edge-on
      // (the castle's silhouette from the current viewpoint) shine more than faces seen head-on.
      float rim = 1.0 - abs(dot(normalize(normalMatrix * normal), normalize(-mv.xyz)));
      vA *= glow * mix(0.6, 1.5, rim * rim);
      vC = color;
      if (uDay > 0.5) {
        // By day the castle is drawn normally: keep a fifth of the edge stars and a few
        // glints on the faces, warm white, flashing on and off, nudged towards the
        // camera so the surface doesn't hide them.
        float keep = edge > 0.5 ? step(fract(phase * 7.7), 0.22) : step(fract(phase * 13.1), 0.025);
        float flash = pow(0.5 + 0.5 * sin(uTime * (1.2 + 2.0 * fract(phase * 3.1)) + phase), 3.0);
        vA = keep * glow * (0.35 + 1.4 * flash) * (edge > 0.5 ? 0.6 : 0.9);
        vC = mix(color, vec3(1.0, 0.93, 0.75), 0.75);
        mv.xyz *= 0.996;
      }
      gl_PointSize = clamp(size * uPR * uScale / -mv.z * (1.0 + 1.2 * uDay), 1.0, (6.0 + 6.0 * uDay) * uPR);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uBright, uDay; varying float vA; varying vec3 vC;
    void main() {
      vec2 q = gl_PointCoord - 0.5;
      float d = length(q);
      float a = smoothstep(0.5, 0.0, d);
      a *= a;
      if (uDay > 0.5) {
        // a small four-pointed sparkle: bright core and two thin rays
        float core = smoothstep(0.18, 0.0, d);
        float rays = max(smoothstep(0.06, 0.0, abs(q.x)), smoothstep(0.06, 0.0, abs(q.y))) * smoothstep(0.5, 0.05, d);
        a = max(core, rays * 0.8);
      }
      if (vA * a < 0.003) discard;
      gl_FragColor = vec4(vC * uBright, a * vA);
    }`,
});
let castleStarsBuilt = false;

// Even (area-weighted) random points over a part's surface, lifted slightly off it.
function surfaceSampler(geo) {
  const P = geo.attributes.position.array, I = geo.index.array;
  const cum = new Float32Array(I.length / 3);
  let area = 0;
  for (let t = 0; t < cum.length; t++) {
    const i0 = I[t * 3] * 3, i1 = I[t * 3 + 1] * 3, i2 = I[t * 3 + 2] * 3;
    const ux = P[i1] - P[i0], uy = P[i1 + 1] - P[i0 + 1], uz = P[i1 + 2] - P[i0 + 2];
    const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
    area += Math.sqrt(cx * cx + cy * cy + cz * cz) / 2;
    cum[t] = area;
  }
  return {
    area,
    sample(out, j, lift = SURFACE_LIFT, nOut) {    // writes one point at out[j*3..j*3+2] (and its normal in nOut)
      const r = Math.random() * area;
      let lo = 0, hi = cum.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
      const i0 = I[lo * 3] * 3, i1 = I[lo * 3 + 1] * 3, i2 = I[lo * 3 + 2] * 3;
      let u = Math.random(), v = Math.random();
      if (u + v > 1) { u = 1 - u; v = 1 - v; }
      const ux = P[i1] - P[i0], uy = P[i1 + 1] - P[i0 + 1], uz = P[i1 + 2] - P[i0 + 2];
      const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1, k = lift / len;
      if (nOut) { nOut[j * 3] = nx / len; nOut[j * 3 + 1] = ny / len; nOut[j * 3 + 2] = nz / len; }
      out[j * 3]     = P[i0] + u * ux + v * vx + nx * k;
      out[j * 3 + 1] = P[i0 + 1] + u * uy + v * vy + ny * k;
      out[j * 3 + 2] = P[i0 + 2] + u * uz + v * vz + nz * k;
    },
  };
}

// Random points along a part's sharp edges: folds between two faces sharper than
// EDGE_ANGLE, and open borders. Each point is pushed off the surface along the
// average of the two face normals, so it sits on the outside of the edge.
function edgeSampler(geo) {
  const P = geo.attributes.position.array, I = geo.index.array, nt = I.length / 3;
  const fn = new Float32Array(nt * 3);
  for (let t = 0; t < nt; t++) {
    const i0 = I[t * 3] * 3, i1 = I[t * 3 + 1] * 3, i2 = I[t * 3 + 2] * 3;
    const ux = P[i1] - P[i0], uy = P[i1 + 1] - P[i0 + 1], uz = P[i1 + 2] - P[i0 + 2];
    const vx = P[i2] - P[i0], vy = P[i2 + 1] - P[i0 + 1], vz = P[i2 + 2] - P[i0 + 2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx, l = Math.hypot(cx, cy, cz) || 1;
    fn[t * 3] = cx / l; fn[t * 3 + 1] = cy / l; fn[t * 3 + 2] = cz / l;
  }
  const first = new Map(), cos = Math.cos(EDGE_ANGLE * Math.PI / 180), segs = [];
  const add = (a, b, t1, t2) => {
    let nx = fn[t1 * 3], ny = fn[t1 * 3 + 1], nz = fn[t1 * 3 + 2];
    if (t2 >= 0) { nx += fn[t2 * 3]; ny += fn[t2 * 3 + 1]; nz += fn[t2 * 3 + 2]; }
    const l = Math.hypot(nx, ny, nz) || 1;
    segs.push(a, b, nx / l, ny / l, nz / l);
  };
  for (let t = 0; t < nt; t++) for (let e = 0; e < 3; e++) {
    const a = I[t * 3 + e], b = I[t * 3 + (e + 1) % 3], key = a < b ? a * 65536 + b : b * 65536 + a;
    const o = first.get(key);
    if (o === undefined) { first.set(key, t); continue; }
    first.set(key, -1);   // seen twice: done
    if (o >= 0 && fn[o * 3] * fn[t * 3] + fn[o * 3 + 1] * fn[t * 3 + 1] + fn[o * 3 + 2] * fn[t * 3 + 2] < cos) add(a, b, o, t);
  }
  for (const [key, t] of first) if (t >= 0) add(Math.floor(key / 65536), key % 65536, t, -1);   // open borders
  const ns = segs.length / 5, cum = new Float32Array(ns);
  let length = 0;
  for (let k = 0; k < ns; k++) {
    const a = segs[k * 5] * 3, b = segs[k * 5 + 1] * 3;
    length += Math.hypot(P[b] - P[a], P[b + 1] - P[a + 1], P[b + 2] - P[a + 2]);
    cum[k] = length;
  }
  return {
    length, segs, P,
    sample(out, j, nOut, lift = SURFACE_LIFT * 1.5) {
      const r = Math.random() * length;
      let lo = 0, hi = ns - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
      const a = segs[lo * 5] * 3, b = segs[lo * 5 + 1] * 3, f = Math.random();
      for (let c = 0; c < 3; c++) {
        const n = segs[lo * 5 + 2 + c];
        out[j * 3 + c] = P[a + c] + (P[b + c] - P[a + c]) * f + n * lift;
        nOut[j * 3 + c] = n;
      }
    },
  };
}

function buildCastleStars() {
  castleStarsBuilt = true;
  const samplers = parts.map(p => surfaceSampler(p.mesh.geometry));
  const edges = parts.map(p => edgeSampler(p.mesh.geometry));
  const totalArea = samplers.reduce((s, x) => s + x.area, 0);
  const totalEdge = edges.reduce((s, x) => s + x.length, 0);
  const tint = new THREE.Color(), c = new THREE.Color();

  parts.forEach((p, k) => {
    const focus = STAR_FOCUS.find(f => f.match(p.mesh.userData)) ?? { count: 1, glow: 1 };
    const ornament = p.dayKey === 'gold';
    const ns = Math.max(4, Math.round(CASTLE_STAR_COUNT * (1 - EDGE_SHARE) * samplers[k].area / totalArea * focus.count * (ornament ? ORNAMENT_SURFACE : 1)));
    const ne = edges[k].length && !ornament ? Math.max(2, Math.round(CASTLE_STAR_COUNT * EDGE_SHARE * edges[k].length / totalEdge * focus.count)) : 0;
    const n = ns + ne;
    const pos = new Float32Array(n * 3), nrm = new Float32Array(n * 3), size = new Float32Array(n), phase = new Float32Array(n),
      spark = new Float32Array(n), glow = new Float32Array(n), edge = new Float32Array(n), col = new Float32Array(n * 3);
    tint.setHex(STAR_TINT[p.dayKey] ?? STAR_TINT.wall);
    for (let j = 0; j < n; j++) {
      const onEdge = j >= ns;
      edge[j] = onEdge ? 1 : 0;
      if (onEdge) edges[k].sample(pos, j, nrm); else samplers[k].sample(pos, j, SURFACE_LIFT, nrm);
      if (Math.abs(nrm[j * 3]) + Math.abs(nrm[j * 3 + 1]) + Math.abs(nrm[j * 3 + 2]) < 0.5) nrm[j * 3 + 2] = 1;   // degenerate face
      spark[j] = Math.pow(Math.random(), onEdge ? 5 : 3);     // most stars quiet, a few restless; edges steadier
      size[j] = (onEdge ? 1.25 : 0.9) + spark[j] * 1.4 + Math.pow(Math.random(), 8) * 2.4;
      glow[j] = (onEdge ? 1.6 : 0.8) * focus.glow * (ornament ? ORNAMENT_GLOW : 1);
      phase[j] = Math.random() * 100;
      c.copy(tint).offsetHSL((Math.random() - 0.5) * 0.04, 0, (Math.random() - 0.5) * 0.12);
      c.toArray(col, j * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
    geo.setAttribute('spark', new THREE.BufferAttribute(spark, 1));
    geo.setAttribute('glow', new THREE.BufferAttribute(glow, 1));
    geo.setAttribute('edge', new THREE.BufferAttribute(edge, 1));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.boundingSphere = p.mesh.geometry.boundingSphere;
    const pts = new THREE.Points(geo, castleStarMat);
    pts.raycast = () => {};          // hover keeps working on the invisible mesh
    p.mesh.add(pts);
    p.stars = pts;
    p.mesh.userData.starPoints = pts;
    if (p.mesh.userData.glass) colorStarsFromGlass(p);
  });
}

// ---------- Magic: LED-studded roofs ----------
const ROOF_LED_COUNT = innerWidth < 800 ? 30000 : 60000;
const ledUniforms = { uTime: castleStarUniforms.uTime, uPR: castleStarUniforms.uPR, uScale: { value: 1300 } };
const ledMat = new THREE.ShaderMaterial({
  uniforms: ledUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float phase; uniform float uTime, uPR, uScale; varying float vA;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float glint = pow(0.5 + 0.5 * sin(uTime * (1.5 + fract(phase * 3.1) * 4.0) + phase), 6.0);
      vA = 0.55 + 0.45 * glint;                     // steady glow with quick glints
      gl_PointSize = clamp((1.1 + glint * 1.4) * uPR * uScale / -mv.z, 1.0, 5.0 * uPR);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    void main() {
      float a = smoothstep(0.5, 0.0, length(gl_PointCoord - 0.5));
      gl_FragColor = vec4(vec3(1.0, 0.96, 0.9) * 1.6, a * a * vA);
    }`,
});
let roofLedsBuilt = false;

function buildRoofLeds() {
  roofLedsBuilt = true;
  const roofs = parts.filter(p => p.dayKey === 'roof');
  const samplers = roofs.map(p => surfaceSampler(p.mesh.geometry));
  const total = samplers.reduce((s, x) => s + x.area, 0);
  roofs.forEach((p, k) => {
    const n = Math.max(6, Math.round(ROOF_LED_COUNT * samplers[k].area / total));
    const pos = new Float32Array(n * 3), phase = new Float32Array(n);
    for (let j = 0; j < n; j++) { samplers[k].sample(pos, j, 0.5); phase[j] = Math.random() * 100; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
    geo.boundingSphere = p.mesh.geometry.boundingSphere;
    const pts = new THREE.Points(geo, ledMat);
    pts.raycast = () => {};
    p.mesh.add(pts);
    p.leds = pts;
  });
}

// ---------- Magic: coloured floodlights from the ground ----------
// decay 0 keeps intensities in the same range as the other lights (the model is in mm).
const UPLIGHTS = [
  { color: 0xa070ff, angle: -38, intensity: 2.6 },    // front left: violet
  { color: 0xff5fd0, angle: 38, intensity: 2.2 },     // front right: magenta
  { color: 0x5f6bff, angle: 125, intensity: 2.0 },    // back left: blue
  { color: 0xc050ff, angle: -125, intensity: 2.0 },   // back right: purple
].map(u => {
  const light = new THREE.SpotLight(u.color, 0, 0, 0.75, 0.85, 0);
  scene.add(light, light.target);
  return { ...u, light };
});
const fireworkFlash = new THREE.PointLight(0xffffff, 0, 0, 0);
scene.add(fireworkFlash);

function placeUplights(front, h) {
  for (const u of UPLIGHTS) {
    const dir = front.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(u.angle));
    u.light.position.copy(dir).multiplyScalar(h * 0.95).setY(h * 0.04);
    u.light.target.position.set(0, h * 0.55, 0);
  }
}

// ---------- Magic: fireworks ----------
// Each burst is one Points object animated entirely on the GPU from its launch time:
// a short rocket trail rises, then the sparks fly out, slow down, fall and crackle out.
const FIREWORK_COLORS = [[0xffd36b, 0xff7a3d], [0xff4fd8, 0x9a6bff], [0x6bf0ff, 0x4f7bff],
  [0xffffff, 0xffd36b], [0x7dff9a, 0x6bf0ff], [0xff5f7a, 0xffd36b], [0xc89bff, 0xffffff]];
const SPARKS = 220, BURST_POOL = 10;
const fireworks = new THREE.Group();
fireworks.visible = false;
scene.add(fireworks);
const bursts = [];
{
  const dir = new Float32Array(SPARKS * 3), rnd = new Float32Array(SPARKS * 3);
  for (let i = 0; i < SPARKS; i++) {
    const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - z * z);
    dir.set([r * Math.cos(a), z, r * Math.sin(a)], i * 3);
    rnd.set([0.75 + Math.random() * 0.25, Math.random(), i < 8 ? 1 : 0], i * 3);   // speed, seed, trail spark
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  geo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 3));
  for (let b = 0; b < BURST_POOL; b++) {
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: castleStarUniforms.uTime, uPR: castleStarUniforms.uPR, uScale: { value: 1600 },
        uOrigin: { value: new THREE.Vector3() }, uStart: { value: -1e9 }, uRise: { value: 1 }, uLife: { value: 2.5 },
        uRadius: { value: 200 }, uGravity: { value: 40 },
        uColorA: { value: new THREE.Color() }, uColorB: { value: new THREE.Color() } },
      vertexShader: `
        attribute vec3 rnd;
        uniform float uTime, uPR, uScale, uStart, uRise, uLife, uRadius, uGravity;
        uniform vec3 uOrigin, uColorA, uColorB;
        varying vec3 vC; varying float vA;
        void main() {
          float t = uTime - uStart;
          vec3 p = uOrigin; float a = 0.0, size = 2.0;
          vC = vec3(1.0, 0.85, 0.6);
          if (t >= 0.0 && t < uRise) {                         // rocket climbing, decelerating
            float k = t / uRise;
            p = uOrigin - vec3(0.0, (1.0 - k) * (1.0 - k) * uRadius * 2.4, 0.0);
            if (rnd.z > 0.5) { p.y -= rnd.y * uRadius * 0.3; a = (1.0 - rnd.y) * 0.9; }
          } else if (t >= uRise) {                             // burst
            float te = t - uRise, u = te / uLife;
            if (rnd.z < 0.5 && u < 1.0) {
              p = uOrigin + position * uRadius * rnd.x * (1.0 - exp(-2.6 * te)) - vec3(0.0, uGravity * te * te, 0.0);
              vec3 c = fract(rnd.y * 7.31) < 0.5 ? uColorA : uColorB;
              vC = mix(vec3(1.0), c, smoothstep(0.0, 0.18, u));
              a = pow(1.0 - u, 1.4);
              if (u > 0.45) a *= 0.45 + 0.55 * step(0.5, fract(uTime * 9.0 + rnd.y * 13.0));   // crackle
              size = mix(3.6, 1.8, u);
            }
          }
          vA = a;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = a > 0.0 ? clamp(size * uPR * uScale / -mv.z, 1.0, 9.0 * uPR) : 0.0;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vC; varying float vA;
        void main() {
          float a = smoothstep(0.5, 0.0, length(gl_PointCoord - 0.5));
          gl_FragColor = vec4(vC * 1.8, a * a * vA);
        }`,
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    fireworks.add(pts);
    bursts.push({ mat, explodeAt: -1e9 });
  }
}
let nextLaunch = 0, castleHeight = 700;

function updateFireworks(nowSec) {
  if (!fireworks.visible) { fireworkFlash.intensity = 0; return; }
  if (nowSec >= nextLaunch) {
    const b = bursts.find(x => nowSec > x.explodeAt + x.mat.uniforms.uLife.value) ?? bursts[0];
    const h = castleHeight, U = b.mat.uniforms;
    // always behind the castle as seen from the camera, scattered left/right
    const away = controls.target.clone().sub(camera.position).setY(0).normalize();
    const side = new THREE.Vector3(-away.z, 0, away.x);
    U.uOrigin.value.copy(controls.target).setY(0)
      .addScaledVector(away, h * (0.5 + Math.random() * 0.9))
      .addScaledVector(side, (Math.random() * 2 - 1) * h * 1.2)
      .setY(h * (1.05 + Math.random() * 0.6));
    const [a, c] = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    U.uColorA.value.setHex(a); U.uColorB.value.setHex(c);
    U.uRadius.value = h * (0.22 + Math.random() * 0.18);
    U.uGravity.value = h * 0.07;
    U.uRise.value = 0.8 + Math.random() * 0.5;
    U.uLife.value = 2.2 + Math.random() * 0.8;
    U.uStart.value = nowSec;
    b.explodeAt = nowSec + U.uRise.value;
    nextLaunch = nowSec + (Math.random() < 0.25 ? 0.15 : 0.5 + Math.random() * 1.2);   // sometimes a double
  }
  // the latest burst briefly lights the castle in its colour
  let best = null, strength = 0;
  for (const b of bursts) {
    const k = 1 - (nowSec - b.explodeAt) / 0.7;
    if (k > 0 && k <= 1 && k > strength) { strength = k; best = b; }
  }
  fireworkFlash.intensity = best ? strength * strength * 1.6 : 0;
  if (best) {
    fireworkFlash.position.copy(best.mat.uniforms.uOrigin.value);
    fireworkFlash.color.copy(best.mat.uniforms.uColorA.value);
  }
}

// ---------- Load the castle ----------
const castle = new THREE.Group();          // Z-up model space
castle.rotation.x = -Math.PI / 2;           // -> Y-up world
scene.add(castle);
let castleBaseY = 0;
const parts = [];                           // { mesh, layer, offset: Vector3 }

loadCastle().catch(err => {
  console.error(err);
  document.getElementById('loadText').textContent = 'Could not load ' + MODEL_URL;
});

async function loadCastle() {
  const buf = await fetchWithProgress(MODEL_URL);
  const dv = new DataView(buf);
  const jsonLen = dv.getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, jsonLen)));
  const posStart = 4 + jsonLen;
  const q = new Uint16Array(buf, posStart, header.positionsBytes / 2);
  const idx = new Uint16Array(buf, posStart + header.positionsBytes, header.indicesBytes / 2);
  const [mx, my, mz] = header.min, [sx, sy, sz] = header.scale;

  // Centers of each sub-assembly, used to push them outward when exploding.
  const groupCenters = {};
  const all = new THREE.Box3();
  for (const p of header.parts) {
    const key = subKey(p.path);
    (groupCenters[key] ??= { sum: new THREE.Vector3(), n: 0 }).sum.add(new THREE.Vector3(...p.center));
    groupCenters[key].n++;
  }

  for (const p of header.parts) {
    const [v0, vn] = p.v, [i0, iN] = p.i;
    const pos = new Float32Array(vn * 3);
    for (let k = 0; k < vn; k++) {
      const s = (v0 + k) * 3;
      pos[k * 3] = mx + q[s] * sx;
      pos[k * 3 + 1] = my + q[s + 1] * sy;
      pos[k * 3 + 2] = mz + q[s + 2] * sz;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx.slice(i0, i0 + iN), 1));
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    if (!/^ROCHERS\/Colline|^BASE\/Rampe d'acces|^BASE\/Bassin/.test(p.path)) all.union(geo.boundingBox);   // frame the castle itself, not the bridge or scenery in front

    const key = dayKey(p), bronze = isBronze(p);
    const night = bronze ? BRONZE.night : MATS[p.mat] ?? MATS.stone, day = bronze ? BRONZE.day : DAY_MATS[key];
    const mesh = new THREE.Mesh(geo, mode === 'day' ? day : night);
    mesh.castShadow = mesh.receiveShadow = p.mat !== 'lantern';
    mesh.userData = { name: p.name, path: p.path, night, day, magic: bronze ? (key === 'roof' ? BRONZE.magic : BRONZE.day) : MAGIC_MATS[key] };
    castle.add(mesh);
    parts.push({ mesh, layerName: p.path.split('/')[0], key: subKey(p.path), dayKey: key });
  }

  // Compute explode offsets now that we know the castle's footprint.
  const center = all.getCenter(new THREE.Vector3());
  for (const part of parts) {
    const L = LAYERS[part.layerName] ?? { lift: 0, spread: 120, order: 1 };
    const g = groupCenters[part.key];
    const c = g.sum.clone().divideScalar(g.n);
    const dir = new THREE.Vector2(c.x - center.x, c.y - center.y);
    if (dir.lengthSq() < 1) dir.set(1, 0);
    dir.normalize().multiplyScalar(L.spread);
    part.offset = new THREE.Vector3(dir.x, dir.y, L.lift);
    part.order = L.order;
  }

  // Sit the castle on the ground, centered on the origin.
  castleBaseY = -all.min.z;
  castle.position.set(-center.x, castleBaseY, center.y);
  ground.position.y = 0;
  const h = all.max.z - all.min.z;
  controls.target.set(0, h * 0.42, 0);
  // Open facing the front: the side of the main entrance (gate and drawbridge).
  const gate = new THREE.Vector3(), gateParts = header.parts.filter(p => p.path.startsWith('BASE/Entree principale'));
  gateParts.forEach(p => gate.add(new THREE.Vector3(...p.center)));
  const front = gateParts.length
    ? new THREE.Vector3(gate.x / gateParts.length - center.x, 0, -(gate.y / gateParts.length - center.y)).normalize()
    : new THREE.Vector3(0, 0, 1);                       // model Z-up -> world: (x, z, -y)
  camera.position.copy(controls.target).addScaledVector(front, h * 1.85).add(new THREE.Vector3(0, h * 0.12, 0));
  castleHeight = h;
  placeUplights(front, h);
  placeShineBeams(front, h);
  placeTalesLasers(front, h);
  moon.target.position.set(0, h * 0.4, 0);

  const loader = document.getElementById('loader');
  loader.style.opacity = 0;
  setTimeout(() => loader.remove(), 900);
  document.getElementById('explode').disabled = false;
  document.getElementById('enter').disabled = false;
  applyInterior();
  applyStainedGlass();   // textures load in the background
  applyTheme(mode);   // builds the star castle if the page opens in that mode
}

// ---------- Stained glass: SVG images mapped onto flat window parts ----------
// u / v say which model axis runs left-to-right and bottom-to-top across the
// image, seen from the front ('-y' = the model's y axis, reversed).
const STAINED_GLASS = [
  { path: 'BATIMENTS/Tour G/Corps batiment', name: 'Vitrail', svg: 'textures/vitrail-tour-g.svg', u: '-y', v: 'z' },
  { path: 'DONJON/Corps partie superieure', name: 'Vitrail gauche', svg: 'textures/vitrail-donjon.svg', u: '-y', v: 'z' },  // front
  { path: 'DONJON/Corps partie superieure', name: 'Vitrail droit', svg: 'textures/vitrail-donjon.svg', u: 'y', v: 'z' },    // back
];
const GLASS_TEX_W = 600, GLASS_TEX_H = 1000;

async function applyStainedGlass() {
  for (const g of STAINED_GLASS) {
    const part = parts.find(p => p.mesh.userData.path === g.path && p.mesh.userData.name === g.name);
    if (!part) continue;
    try {
      const img = new Image();
      img.src = g.svg;
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = GLASS_TEX_W; canvas.height = GLASS_TEX_H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, GLASS_TEX_W, GLASS_TEX_H);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const geo = part.mesh.geometry;
      const uvOf = planarUV(geo.boundingBox, g.u, g.v);
      const P = geo.attributes.position.array, uv = new Float32Array(P.length / 3 * 2);
      for (let i = 0; i < uv.length / 2; i++) uv.set(uvOf(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]), i * 2);
      geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

      // Glass lets light through: a little glow by day, backlit at night.
      const day = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff,
        emissiveIntensity: 0.3, roughness: 0.25, flatShading: true });
      const night = day.clone();
      night.emissiveIntensity = 1.6;

      if (hovered === part.mesh) setHover(null);
      const ud = part.mesh.userData;
      ud.day = day; ud.night = night; ud.magic = night;
      if (mode !== 'stars') part.mesh.material = matOf(ud, mode);
      ud.glass = { pixels: ctx.getImageData(0, 0, GLASS_TEX_W, GLASS_TEX_H).data, uvOf };
      if (blueprintBuilt) { ud.blueprint = blueprintGlassMat(tex); if (THEMES[mode].paper) part.mesh.material = ud.blueprint; }
      if (shineBuilt) { ud.shine = shineMaterial(ud.magic); if (mode === 'shine') part.mesh.material = ud.shine; }
      if (talesBuilt) { ud.tales = talesMaterial(ud.magic, 'glass'); if (mode === 'tales') part.mesh.material = ud.tales; }
      if (xmasBuilt) { ud.xmas = xmasMaterial(ud.magic); ud.xmasDay = xmasMaterial(ud.day); if (THEMES[mode].snow) part.mesh.material = matOf(ud, mode); }
      if (part.stars) colorStarsFromGlass(part);
    } catch (e) {
      showError(e);
    }
  }
}

function planarUV(box, uAxis, vAxis) {
  const axis = a => ({ i: 'xyz'.indexOf(a.slice(-1)), flip: a[0] === '-' });
  const U = axis(uAxis), V = axis(vAxis);
  const lo = box.min.toArray(), hi = box.max.toArray();
  const f = (A, c) => A.flip ? (hi[A.i] - c[A.i]) / (hi[A.i] - lo[A.i]) : (c[A.i] - lo[A.i]) / (hi[A.i] - lo[A.i]);
  return (x, y, z) => [f(U, [x, y, z]), f(V, [x, y, z])];
}

// Star mode: the window's stars take the colours of its glass.
function colorStarsFromGlass(part) {
  const { pixels, uvOf } = part.mesh.userData.glass;
  const pos = part.stars.geometry.attributes.position, col = part.stars.geometry.attributes.color;
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const [u, v] = uvOf(pos.getX(i), pos.getY(i), pos.getZ(i));
    const px = Math.min(GLASS_TEX_W - 1, Math.max(0, Math.floor(u * GLASS_TEX_W)));
    const py = Math.min(GLASS_TEX_H - 1, Math.max(0, Math.floor((1 - v) * GLASS_TEX_H)));
    const k = (py * GLASS_TEX_W + px) * 4;
    c.setRGB(pixels[k] / 255, pixels[k + 1] / 255, pixels[k + 2] / 255, THREE.SRGBColorSpace);
    c.toArray(col.array, i * 3);
  }
  col.needsUpdate = true;
}

// ---------- Interior: textured floors, walls and vaults ----------
// Procedural textures (drawn on a canvas, nothing to download). Each listed part
// gets a shader that picks a texture by face direction: floor (facing up),
// ceiling (facing down) or wall, projected along the face's main axis, in mm.
// The ceiling is only painted on: the rib vault and tree-like columns aren't modelled.
const INTERIOR = [
  // Passage under the castle, from the drawbridge to the back: stone paving, ashlar walls, rib vault
  ...['Couloir avant', 'Couloir partie arriere'].map(name => ({ name, floor: 'flagstones', wall: 'ashlar', ceil: 'vault',
    tint: { day: 0xffffff, night: 0x9896bb, magic: 0xe6dcf2 } })),
  { name: 'Pont levis', floor: 'planks', wall: 'planks', ceil: 'planks', tint: { day: 0xffffff, night: 0x8a86a8, magic: 0xd0c8e0 } },
  // Courtyard: light paving on top of the platform, in the castle's own colours
  ...['A1', 'A2', 'A3', 'A4'].map(n => ({ name: 'Plateforme ' + n, floor: 'paving' })),
];
const INTERIOR_SCALE = { flagstones: 48, ashlar: 40, vault: 34, planks: 60, paving: 36 };   // mm per repeat (vault: one bay)

function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Rows of blocks of random width that tile seamlessly (used by flagstones, ashlar, paving)
function drawCourses(ctx, S, rnd, rowH, minW, maxW, fill, joint, jw) {
  ctx.fillStyle = joint; ctx.fillRect(0, 0, S, S);

function glowTexture() {
  const S = 128, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.15, 'rgba(225,220,255,0.9)');
  g.addColorStop(0.4, 'rgba(150,140,255,0.25)'); g.addColorStop(1, 'rgba(120,100,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const tipFlare = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending,
  depthWrite: false, transparent: true, opacity: 0.7 }));
tipFlare.raycast = () => {};

const tipLight = new THREE.PointLight(0xc8b8ff, 0, 400, 0);   // lights the top of the keep; fades out by 400 mm

let tipMesh = null, tipLocal = new THREE.Vector3(), shineHeight = 700;

// Xmas: the keep's spire wears a twinkling star, like the top of a Christmas tree
function starTexture() {
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d'), m = S / 2;
  const glow = ctx.createRadialGradient(m, m, 0, m, m, m);
  glow.addColorStop(0, 'rgba(255,250,225,1)'); glow.addColorStop(0.12, 'rgba(255,225,150,0.85)');
  glow.addColorStop(0.35, 'rgba(255,190,90,0.18)'); glow.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, S, S);
  const ray = (angle, len, width, alpha) => {   // a tapering ray of light
    ctx.save(); ctx.translate(m, m); ctx.rotate(angle);
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, `rgba(255,245,210,${alpha})`); g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -width); ctx.lineTo(len, 0); ctx.lineTo(0, width); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  for (let k = 0; k < 4; k++) ray(k * Math.PI / 2, m * 0.98, 7, 0.95);                 // four long rays
  for (let k = 0; k < 4; k++) ray(Math.PI / 4 + k * Math.PI / 2, m * 0.55, 5, 0.7);    // four short ones
  ctx.fillStyle = 'rgba(255,248,220,1)';                                               // a little five-point star at the heart
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 7 : 17, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(m + Math.cos(a) * r, m + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const treeStar = new THREE.Sprite(new THREE.SpriteMaterial({ map: starTexture(), blending: THREE.AdditiveBlending,
  depthWrite: false, transparent: true }));

// Projectors: four fans (front-left, front-right, back-left, back-right) spread on the ground.
function placeShineBeams(front, h) {
  shineHeight = h;
  beamUniforms.uLen.value = h * 1.7;
  beamUniforms.uSweep.value = h * 0.04;
  beamUniforms.uWidth.value = h * 0.0045;
  const right = new THREE.Vector3().crossVectors(front, new THREE.Vector3(0, 1, 0));
  const ground = [], beam = [], index = [];
  let v = 0;
  for (const [f, side, bright] of [[1, -1, 1], [1, 1, 1], [-1, -1, 0.55], [-1, 1, 0.55]]) {
    for (let i = 0; i < BEAMS_PER_FAN; i++) {
      const k = i / (BEAMS_PER_FAN - 1);
      const g = front.clone().multiplyScalar(f * h * (0.55 + 0.35 * k))
        .addScaledVector(right, side * h * (0.35 + 0.75 * k)).setY(h * 0.01);
      const phase = (i * 2.399 + (f + 2) * 1.3 + side) % 6.283;
      for (const t of [0, 0.5, 1]) for (const s of [-1, 1]) { ground.push(g.x, g.y, g.z); beam.push(s, t, phase, bright * (0.75 + 0.25 * Math.sin(i * 1.7))); }
      for (const q of [0, 2]) index.push(v + q, v + q + 1, v + q + 3, v + q, v + q + 3, v + q + 2);
      v += 6;
    }
  }
  beamGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(v * 3), 3));
  beamGeo.setAttribute('aGround', new THREE.Float32BufferAttribute(ground, 3));
  beamGeo.setAttribute('aBeam', new THREE.Float32BufferAttribute(beam, 4));
  beamGeo.setIndex(index);
  tipFlare.scale.setScalar(h * 0.06);
}

function findSpireTip() {
  const tip = parts.find(p => p.mesh.userData.path === 'DONJON/Toiture' && p.mesh.userData.name === 'Pointe');
  if (tip) {
    tipMesh = tip.mesh;
    const b = tip.mesh.geometry.boundingBox;
    tipLocal.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, b.max.z);   // model z is up
  }
}
function buildShine() {
  shineBuilt = true;
  for (const p of parts) p.mesh.userData.shine = shineMaterial(p.mesh.userData.magic);
}
function setBeamLook(name) {
  const L = BEAM_LOOKS[name];
  beamUniforms.uEdge.value.setRGB(...L.edge); beamUniforms.uCore.value.setRGB(...L.core); beamUniforms.uGain.value = L.gain;
  tipFlare.material.color.setHex(L.flare);
  tipLight.color.setHex(L.light);
  beams.visible = L.gain > 0;
  tipFlare.visible = !L.star;
  treeStar.visible = !!L.star;
  return L;
}

function updateShine(t) {
  if (!shineGroup.visible) return;
  shineUniforms.uShineTime.value = t;
  beamUniforms.uTime.value = t;
  if (tipMesh) {
    tipMesh.localToWorld(beamUniforms.uOrigin.value.copy(tipLocal));   // follows the spire (explode, spin)
    tipFlare.position.copy(beamUniforms.uOrigin.value);
    tipLight.position.copy(beamUniforms.uOrigin.value);
  }
  const pulse = 0.85 + 0.15 * Math.sin(t * 2.2) + 0.08 * Math.sin(t * 7.3);
  tipFlare.scale.setScalar(shineHeight * 0.06 * pulse);
  if (treeStar.visible) {
    // twinkle: a slow breath, quick sparkles, and the rays turning gently
    const tw = 0.8 + 0.12 * Math.sin(t * 1.6) + 0.1 * Math.max(0, Math.sin(t * 9.1)) * Math.max(0, Math.sin(t * 3.7));
    treeStar.position.copy(beamUniforms.uOrigin.value).y += shineHeight * 0.012;
    treeStar.scale.setScalar(shineHeight * 0.09 * tw);
    treeStar.material.rotation = Math.sin(t * 0.4) * 0.25;
    treeStar.material.opacity = 0.75 + 0.25 * tw;
    tipLight.intensity = 0.6 + 0.4 * tw;
  }
}

// ---------- Tales: night show with projection mapping, lasers, fireworks and a drone show ----------
// The castle goes dark and its architecture is redrawn in neon: every edge lit as a
// coloured line with LED dots, pulses running upwards; the rocks become a pixel screen.
// Laser fans sweep the sky from both sides, fireworks go off as in Magic (the roofs
// don't sparkle here), and drones draw figures behind the castle.
const talesUniforms = { uTalesTime: { value: 0 } };
let talesBuilt = false;
const talesMatCache = new Map();
// The walls go almost black; the rocks become a pixel screen (orange at the bottom,
// pink, then violet at the top); windows glow green.
function talesMaterial(base, kind) {
  const key = kind + '|' + base.uuid;
  if (talesMatCache.has(key)) return talesMatCache.get(key);
  const m = base.clone();
  m.polygonOffset = true; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1;   // neon lines stay in front
  const prev = base.onBeforeCompile, prevKey = base.customProgramCacheKey.call(base);
  m.onBeforeCompile = (sh, r) => {
    prev.call(m, sh, r);   // keeps the textured interiors
    Object.assign(sh.uniforms, talesUniforms);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vTales;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvTales = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
      varying vec3 vTales; uniform float uTalesTime;
      vec3 talesGlow(vec3 p) {
        float t = uTalesTime;
        ${kind === 'rock' ? `
        vec3 n = abs(normalize(cross(dFdx(p), dFdy(p))));
        vec2 uv = n.z > max(n.x, n.y) ? p.xy : (n.x > n.y ? p.yz : p.xz);
        vec2 cell = floor(uv / 3.4);
        float dotMask = smoothstep(0.36, 0.2, length(fract(uv / 3.4) - 0.5));
        float h = clamp((p.z + 138.0) / 300.0, 0.0, 1.0);
        vec3 col = mix(vec3(1.0, 0.5, 0.12), vec3(1.0, 0.25, 0.7), smoothstep(0.0, 0.5, h));
        col = mix(col, vec3(0.45, 0.3, 1.0), smoothstep(0.45, 1.0, h));
        float tw = 0.55 + 0.45 * sin(t * 2.0 + fract(sin(dot(cell, vec2(12.99, 78.23))) * 437.5) * 6.28);
        float wave = 0.6 + 0.4 * sin(p.z * 0.03 - t * 1.5);
        return col * dotMask * tw * wave * 0.6;` : kind === 'glass' ? `
        return vec3(0.2, 1.0, 0.4) * (0.4 + 0.18 * sin(t * 1.5));` : `
        return vec3(0.05, 0.02, 0.12);`}
      }`)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ndiffuseColor.rgb *= 0.16;\ntotalEmissiveRadiance = talesGlow(vTales);');
  };
  m.customProgramCacheKey = () => 'tales-' + kind + '|' + prevKey;
  talesMatCache.set(key, m);
  return m;
}

// Neon outlines: every sharp edge of the castle, as a line plus a row of LED dots.
// Colour by kind of part: walls magenta, trims and frames green, roofs cyan,
// gilding yellow, wood orange, ironwork violet. Light pulses run up the castle.
const NEON = { wall: 0xff2fd0, base: 0x9a5cff, trim: 0x3dff6a, roof: 0x2fd0ff, gold: 0xffd23d, timber: 0xff8a2f,
  iron: 0xb070ff, glass: 0x3dff6a, brick: 0xff4f7a, lantern: 0xffe28a, tree: 0x3dff6a, hedge: 0x3dff6a, grass: 0x3dff6a };
const neonUniforms = { uTime: talesUniforms.uTalesTime, uPR: { value: renderer.getPixelRatio() }, uScale: { value: 1300 }, uGain: { value: 1 } };
const neonLineMat = new THREE.ShaderMaterial({
  uniforms: neonUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 color; uniform float uTime, uGain; varying vec3 vC;
    void main() {
      float pulse = 0.55 + 0.45 * smoothstep(0.6, 1.0, sin(position.z * 0.025 - uTime * 2.2));
      vC = color * pulse * 0.7 * uGain;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `varying vec3 vC; void main() { gl_FragColor = vec4(vC, 1.0); }`,
});
const neonDotMat = new THREE.ShaderMaterial({
  uniforms: neonUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 color; uniform float uTime, uPR, uScale, uGain; varying vec3 vC;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float pulse = 0.5 + 0.5 * smoothstep(0.5, 1.0, sin(position.z * 0.025 - uTime * 2.2));
      vC = color * pulse * uGain;
      gl_PointSize = clamp(1.6 * uPR * uScale / -mv.z, 1.0, 5.0 * uPR);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vC;
    void main() { float a = smoothstep(0.5, 0.1, length(gl_PointCoord - 0.5)); gl_FragColor = vec4(vC * 0.9, a); }`,
});
const NEON_DOT_SPACING = 4.5;   // mm between LED dots along the edges

function buildTales() {
  talesBuilt = true;
  const c = new THREE.Color();
  for (const p of parts) {
    const ud = p.mesh.userData;
    const kind = p.dayKey === 'rock' ? 'rock' : (ud.glass || p.dayKey === 'glass') ? 'glass' : 'dark';
    ud.tales = talesMaterial(ud.magic, kind);
    if (kind === 'rock') continue;                     // the rocks are a pixel screen instead
    const { segs, P } = edgeSampler(p.mesh.geometry);
    const n = segs.length / 5;
    if (!n) continue;
    c.setHex(NEON[p.dayKey] ?? NEON.wall);
    const roof = p.dayKey === 'roof';                  // tiled roofs have a lot of edges: keep them dim, no dots
    if (roof) c.multiplyScalar(0.4);
    const lp = new Float32Array(n * 6), lc = new Float32Array(n * 6), dp = [], dc = [];
    for (let k = 0; k < n; k++) {
      const a = segs[k * 5] * 3, b = segs[k * 5 + 1] * 3;
      lp.set([P[a], P[a + 1], P[a + 2], P[b], P[b + 1], P[b + 2]], k * 6);
      lc.set([c.r, c.g, c.b, c.r, c.g, c.b], k * 6);
      const len = Math.hypot(P[b] - P[a], P[b + 1] - P[a + 1], P[b + 2] - P[a + 2]);
      for (let d = Math.random() * NEON_DOT_SPACING; !roof && d < len; d += NEON_DOT_SPACING) {
        const f = d / len;
        dp.push(P[a] + (P[b] - P[a]) * f, P[a + 1] + (P[b + 1] - P[a + 1]) * f, P[a + 2] + (P[b + 2] - P[a + 2]) * f);
        dc.push(c.r, c.g, c.b);
      }
    }
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
    lg.setAttribute('color', new THREE.BufferAttribute(lc, 3));
    lg.boundingSphere = p.mesh.geometry.boundingSphere;
    const lines = new THREE.LineSegments(lg, neonLineMat);
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
    dg.setAttribute('color', new THREE.Float32BufferAttribute(dc, 3));
    dg.boundingSphere = p.mesh.geometry.boundingSphere;
    const dots = new THREE.Points(dg, neonDotMat);
    const neon = new THREE.Group();
    neon.add(lines, dots);
    lines.raycast = dots.raycast = () => {};
    p.mesh.add(neon);
    p.neon = neon;
  }
}

const talesGroup = new THREE.Group();
talesGroup.visible = false;
scene.add(talesGroup);

// Laser fans: two projectors on the ground in front, left (pink) and right (green),
// each sweeping a fan of beams across the sky.
const LASERS_PER_FAN = 7;
const laserUniforms = { uTime: { value: 0 }, uLen: { value: 1500 }, uWidth: { value: 2.5 },
  uFront: { value: new THREE.Vector3(0, 0, 1) }, uRight: { value: new THREE.Vector3(1, 0, 0) } };
const laserMat = new THREE.ShaderMaterial({
  uniforms: laserUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 aOrigin; attribute vec4 aAim; attribute vec2 aBeam;   // aim: azimuth, elevation, phase, colour; beam: side, t
    uniform float uTime, uLen, uWidth; uniform vec3 uFront, uRight;
    varying float vSide, vT; varying vec3 vCol;
    void main() {
      float az = aAim.x + 0.35 * sin(uTime * 0.55 + aAim.z);
      float el = aAim.y + 0.12 * sin(uTime * 0.8 + aAim.z * 1.7);
      vec3 d = normalize(cos(el) * (cos(az) * uRight + sin(az) * uFront) + vec3(0.0, sin(el), 0.0));
      vec3 P = aOrigin + d * uLen * aBeam.y;
      vec3 s = normalize(cross(d, cameraPosition - P));
      P += s * aBeam.x * uWidth * mix(1.0, 3.0, aBeam.y);
      vSide = aBeam.x; vT = aBeam.y;
      vCol = aAim.w < 0.5 ? vec3(1.0, 0.25, 0.85) : vec3(0.25, 1.0, 0.35);
      gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    varying float vSide, vT; varying vec3 vCol;
    void main() {
      float core = 1.0 - abs(vSide);
      gl_FragColor = vec4(mix(vCol, vec3(1.0), core * core * 0.4) * core * pow(1.0 - vT, 1.4) * 0.9, 1.0);
    }`,
});
const laserGeo = new THREE.BufferGeometry();
const lasers = new THREE.Mesh(laserGeo, laserMat);
lasers.frustumCulled = false;
talesGroup.add(lasers);

// Drone show: points flying between figures drawn behind the castle, always facing you.
const DRONES = innerWidth < 800 ? 360 : 560;
const droneUniforms = { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() } };
const droneMat = new THREE.ShaderMaterial({
  uniforms: droneUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 color; attribute float phase;
    uniform float uTime, uPR; varying vec3 vC; varying float vA;
    void main() {
      vC = color;
      vA = 0.8 + 0.2 * sin(uTime * 3.0 + phase);
      gl_PointSize = 4.2 * uPR;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vC; varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(mix(vC, vec3(1.0), smoothstep(0.2, 0.0, d) * 0.6) * 1.4, a * vA);
    }`,
});
// By day the drones fly the same show with their lights off: small dark silhouettes.
const droneDayMat = new THREE.ShaderMaterial({
  uniforms: droneUniforms, transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uPR;
    void main() {
      gl_PointSize = 4.6 * uPR;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    void main() {
      float a = smoothstep(0.5, 0.3, length(gl_PointCoord - 0.5));
      gl_FragColor = vec4(0.13, 0.14, 0.2, a * 0.85);
    }`,
});
const droneGeo = new THREE.BufferGeometry();
const dronePos = new Float32Array(DRONES * 3), droneCol = new Float32Array(DRONES * 3), dronePhase = new Float32Array(DRONES);
for (let i = 0; i < DRONES; i++) dronePhase[i] = Math.random() * 6.28;
droneGeo.setAttribute('position', new THREE.BufferAttribute(dronePos, 3));
droneGeo.setAttribute('color', new THREE.BufferAttribute(droneCol, 3));
droneGeo.setAttribute('phase', new THREE.BufferAttribute(dronePhase, 1));
const drones = new THREE.Points(droneGeo, droneMat);
drones.frustumCulled = false;
talesGroup.add(drones);

// Figures, drawn in a 2D frame (x right, y up, about -1..1) as coloured strokes.
// All original designs.
const circle = (cx, cy, rx, ry = rx, a0 = 0, a1 = Math.PI * 2, n = 40) =>
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const mirror = pts => pts.map(([x, y]) => [-x, y]);
// Flip the train to face right, bend it along an arc (track curving like a bridge over the
// castle) and tilt it so it climbs: a sense of movement instead of a flat side view.
function trainPose(strokes) {
  const R = 2.6, track = 0.11, tilt = 0.4;
  const pose = ([x, y]) => {
    x = -x;                                            // face right
    const a = x / R, r = R + (y - track);
    let X = r * Math.sin(a), Y = track + r * Math.cos(a) - R;
    const c = Math.cos(tilt), sn = Math.sin(tilt);     // climb towards the right
    return [X * c - (Y - 0.5) * sn + 0.05, X * sn + (Y - 0.5) * c + 0.55];
  };
  const fine = pts => pts.flatMap((p, i) => i === 0 ? [p] :   // cut straight strokes so they bend too
    Array.from({ length: 12 }, (_, k) => [pts[i - 1][0] + (p[0] - pts[i - 1][0]) * (k + 1) / 12, pts[i - 1][1] + (p[1] - pts[i - 1][1]) * (k + 1) / 12]));
  return strokes.map(([color, pts]) => [color, fine(pts).map(pose)]);
}
// round off a polyline (Chaikin corner cutting), for soft, hand-drawn curves
function smooth(pts, passes = 3) {
  for (let k = 0; k < passes; k++)
    pts = [pts[0], ...pts.slice(0, -1).flatMap((p, i) => { const q = pts[i + 1];
      return [[p[0] * 0.75 + q[0] * 0.25, p[1] * 0.75 + q[1] * 0.25], [p[0] * 0.25 + q[0] * 0.75, p[1] * 0.25 + q[1] * 0.75]]; }), pts[pts.length - 1]];
  return pts;
}
const spiral = (cx, cy, r0, r1, turns, dir = 1, n = 50) => Array.from({ length: n + 1 }, (_, i) => {
  const t = i / n, a = dir * t * turns * Math.PI * 2, r = r0 + (r1 - r0) * t;
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
});

const heart = (cx, cy, r, n = 60) => Array.from({ length: n + 1 }, (_, i) => {   // classic heart curve
  const t = i / n * Math.PI * 2;
  return [cx + r * 16 * Math.sin(t) ** 3 / 16, cy + r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16];
});
const DRONE_FIGURES = [
  // a rainbow arc over the whole castle, from the ground on the left to the ground on the right,
  // like a storybook logo: red on the left round to violet on the right (ground level: y -1.58)
  { name: 'rainbow arc', strokes: Array.from({ length: 60 }, (_, k) => {
    const a0 = (180 - k * 3) * Math.PI / 180, a1 = (180 - (k + 1) * 3) * Math.PI / 180;
    return [new THREE.Color().setHSL(k / 60 * 0.8, 1, 0.6).getHex(), circle(0, -1.58, 2.0, 2.15, a0, a1, 4)];
  }) },
  // laid out around the castle: the middle of the frame (|x| < 0.8) is where the castle stands
  { name: 'hearts', strokes: [
    [0xff4f9a, heart(-1.55, 0.35, 0.5)], [0xff9ad0, heart(-1.55, 0.4, 0.3)],      // big heart on the left
    [0xc070ff, heart(1.5, 0.55, 0.38)], [0xff9ad0, heart(1.5, 0.6, 0.2)],         // another on the right
    [0xff3d6a, heart(-0.95, 1.2, 0.16)], [0xff4f9a, heart(1.0, 1.35, 0.14)],      // little ones floating higher up
    [0xff9ad0, heart(-2.05, -0.45, 0.13)], [0xff3d6a, heart(2.05, -0.3, 0.15)],
